<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell — sticky top bar, scrolling content, bottom tab bar on phones (side rail on desktop). */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#e9ecf2; --fg:#151a26; --muted:#5d667a; --line:#d6dae3;
  --accent:#1c3f8f; --accent-fg:#ffffff; --accent-soft:#e3e9f8;
  --red:#c8202f; --red-soft:#fbe4e6; --green:#1d8a4b; --green-soft:#dff3e6; --amber:#b67a00; --amber-soft:#fff1cc;
  --blue:#2f6fd6; --blue-soft:#e0ebfb; --orange:#d9600c; --orange-soft:#fde7d5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b1f2a; --surface2:#242936; --fg:#eceef3; --muted:#9aa3b5; --line:#323847;
  --accent:#7ea0ee; --accent-fg:#0f1830; --accent-soft:#232d47;
  --red:#ff6b76; --red-soft:#3d1c21; --green:#5fcf8a; --green-soft:#16301f; --amber:#f2c14e; --amber-soft:#3a2e0e;
  --blue:#7fb0ff; --blue-soft:#1c2c48; --orange:#ff9d5c; --orange-soft:#3d2312; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b1f2a; --surface2:#242936; --fg:#eceef3; --muted:#9aa3b5; --line:#323847;
  --accent:#7ea0ee; --accent-fg:#0f1830; --accent-soft:#232d47;
  --red:#ff6b76; --red-soft:#3d1c21; --green:#5fcf8a; --green-soft:#16301f; --amber:#f2c14e; --amber-soft:#3a2e0e;
  --blue:#7fb0ff; --blue-soft:#1c2c48; --orange:#ff9d5c; --orange-soft:#3d2312; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* app shell */
#app{height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar .brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1}
.topbar .brand small{display:block;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:3px}
.topbar .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.topbar .who b{display:block;font-weight:600}
.topbar .logout{background:transparent;border:1px solid color-mix(in srgb,var(--accent-fg) 45%,transparent);color:var(--accent-fg);border-radius:8px;padding:6px 10px;font-size:13px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.content{flex:1;min-width:0;overflow-y:auto;padding:16px;padding-block:16px 24px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--accent);background:var(--accent-soft)}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 16px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (min-width:760px){
  .main{flex-direction:row-reverse}
  .tabbar{flex-direction:column;border-top:0;border-right:1px solid var(--line);width:110px;padding:12px 8px;justify-content:flex-start;gap:4px}
  .tabbar button{flex:0 0 auto;padding:10px 4px;font-size:12px}
  .tabbar .dot{right:12px}
}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)} .badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)} .badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.orange{background:var(--orange-soft);color:var(--orange)} .badge.grey{background:var(--surface2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px;font-size:13px;background:var(--surface)}
.chip .av{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip.me{border-color:var(--accent);background:var(--accent-soft)}
.chip.inactive{color:var(--red);border-color:var(--red)}
.name-inactive{color:var(--red);font-weight:600}
.stripe{border-left:5px solid var(--line)}
.stripe.renfort{border-left-color:var(--red)} .stripe.vacation{border-left-color:var(--green)} .stripe.formation{border-left-color:var(--amber)} .stripe.evenement{border-left-color:var(--orange)} .stripe.permanence{border-left-color:var(--blue)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--surface2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;font-size:15px;width:100%;min-width:0}
.field input[type=date],.field input[type=time]{min-height:38px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1px dashed var(--line);border-radius:var(--radius)}
.segment{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.segment button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.segment button.active{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.subtabs button.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px}
.day .d{text-align:center;background:var(--surface2);border-radius:8px;padding:6px 0;align-self:start}
.day .d b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.day .d span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.day.today .d{background:var(--accent);color:var(--accent-fg)} .day.today .d span{color:var(--accent-fg)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.slot .t{font-weight:600}

/* Excel-like grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.pgrid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.pgrid th,.pgrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;height:28px;min-width:26px}
.pgrid th{background:var(--surface2);font-weight:600;position:sticky;top:0;z-index:1}
.pgrid th.we,.pgrid td.we{background:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.pgrid .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 8px;white-space:nowrap;min-width:150px;font-weight:500}
.pgrid th.nm{z-index:3}
.pgrid .tot{font-weight:700;background:var(--surface2);min-width:44px;position:sticky;right:0;z-index:2}
.pgrid td.c{font-weight:700;color:#fff}
.pgrid td.c.renfort{background:var(--red)} .pgrid td.c.vacation{background:var(--green)} .pgrid td.c.formation{background:var(--amber)} .pgrid td.c.evenement{background:var(--orange)} .pgrid td.c.permanence{background:var(--blue)}
.pgrid td.wait{background:repeating-linear-gradient(135deg,var(--surface2) 0 4px,var(--surface) 4px 8px);color:var(--muted);font-weight:600}
.pgrid td.mine{cursor:pointer}
.pgrid td.mine:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.pgrid th.dayh{cursor:pointer}
.pgrid th.sel{background:var(--accent);color:var(--accent-fg)} .pgrid th.sel .muted{color:var(--accent-fg)}
.pgrid td.sel{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.pgrid tr.count td{font-weight:700;font-size:11px;background:var(--surface2)}
.pgrid tr.count td.nm{font-size:12px}
.pgrid tr.count td.full{background:var(--green-soft);color:var(--green)}
.pgrid tr.count td.open{background:var(--amber-soft);color:var(--amber)}
.pgrid tr.count td.over{background:var(--red-soft);color:var(--red)}
.pgrid tr.count td.notit{color:var(--muted)}
.chip.wait{border:1px dashed var(--amber);color:var(--fg);background:var(--amber-soft)}
.chip.wait .av{background:var(--amber);color:var(--surface)}
.chip.wait::after{content:"en attente";font-size:11px;font-weight:600;color:var(--amber);margin-left:2px}
.chip.ok{border-color:var(--green);background:var(--green-soft)}
.chip.ok .av{background:var(--green);color:var(--surface)}
.chip.tit{border-color:var(--blue);background:var(--blue-soft)}
.chip.tit .av{background:var(--blue);color:var(--surface)}
.legend i.hatch{background:repeating-linear-gradient(135deg,var(--surface2) 0 3px,var(--surface) 3px 6px);border:1px dashed var(--muted)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:11px;height:16px;border-radius:3px;border:1px solid var(--line);background:var(--surface2)}
.meter i.on{background:var(--green);border-color:var(--green)}
.meter i.over{background:var(--surface);border:2px solid var(--red)}
.dayrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .d{width:44px;text-align:center;background:var(--surface2);border-radius:8px;padding:4px 0;flex-shrink:0}
.dayrow .d b{display:block;font-family:var(--display);font-size:19px;line-height:1}
.dayrow .d span{font-size:10px;text-transform:uppercase;color:var(--muted)}
.dayrow .mid{flex:1 1 96px;min-width:0}
.dayrow .actn{margin-left:auto;display:flex;align-items:center;gap:6px}
.dinput{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;min-height:38px;max-width:150px;flex-shrink:0}
.dayrow button.mid{background:none;border:0;padding:4px 0;text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dlist>div{flex-wrap:wrap}
.dlist>div>:first-child{flex:1 1 140px;min-width:0}
.dlist .num{white-space:nowrap}
.check{align-items:flex-start}
.check input{flex-shrink:0;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:2px 0}
.cal-d{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.cal-d b{font-family:var(--display);font-size:20px;line-height:1}
.cal-d .cnt{font-size:11px;font-weight:700;line-height:1;min-height:11px;color:var(--muted)}
.cal-d .cnt.full{color:var(--green)} .cal-d .cnt.open{color:var(--amber)} .cal-d .cnt.over{color:var(--red)}
.cal-d.wait{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--surface) 5px 10px);border:1px dashed var(--muted)}
.cal-d.ok{background:var(--green);border-color:var(--green);color:var(--surface)}
.cal-d.tit{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.cal-d.ok .cnt,.cal-d.tit .cnt{color:inherit}
.cal-d.past{opacity:.45}
.cal-d.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cal-d.sel{outline:3px solid var(--accent);outline-offset:1px}
.myact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:8px;padding:10px}
.myact .btn{flex:1 1 auto;justify-content:center;padding:10px 12px;font-size:15px}
.dlist>.valrow{padding:12px 0;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:10px}
.dlist>.valrow>:first-child{flex:0 0 auto}
.valrow .btn{flex:1;justify-content:center;padding:10px 12px}
.dlist>div>.pl{flex:1 1 150px}
.abtn{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;line-height:1.5}
.adet{margin-top:4px;padding:6px 8px;background:var(--surface2);border-radius:6px}
.badge.navy{background:var(--accent-soft);color:var(--accent)}
.stripe.vacation{border-left-color:var(--accent)}
.pgrid tr.count td.vr.navy{background:var(--accent-soft);color:var(--accent)}
.next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--green);background:var(--green-soft)}
.w-sm{display:none}
.login .logo{margin-bottom:6px}
@media (max-width:600px){
  .w-lg{display:none} .w-sm{display:inline}
  .topbar{padding:8px 12px;gap:8px}
  .topbar .brand{font-size:20px;white-space:nowrap}
  .topbar .brand small{display:inline;margin:0 0 0 6px;font-size:10px;opacity:.7;letter-spacing:.04em}
  .topbar .who{font-size:12px;min-width:0}
  .topbar .who b{white-space:nowrap}
  .topbar .logout{padding:5px 8px}
  .content{padding:12px;padding-block:12px 20px}
  .wrap{gap:12px}
  h2{font-size:20px}
  .monthnav b{min-width:118px;font-size:19px}
  .cal{gap:3px} .cal-d{min-height:44px} .cal-d b{font-size:18px}
  .card{padding:12px}
  .paxdetail{padding-left:0 !important}
  .pgrid .nm{min-width:92px}
  .login{background:var(--accent);padding:16px 12px}
}
.notif{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-color:var(--orange);background:var(--orange-soft)}
.pgrid .hb{padding:0 8px;white-space:nowrap;font-weight:600}
.pgrid th.hb{font-size:11px}
.pgrid td.hb.green{background:var(--green-soft);color:var(--green)} .pgrid td.hb.amber{background:var(--amber-soft);color:var(--amber)}
.pgrid td.hb.red{background:var(--red-soft);color:var(--red)} .pgrid td.hb.grey{color:var(--muted)}
.htab td,.htab th{height:34px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{flex:1 1 auto;justify-content:center;padding:10px 12px}
.flash{outline:3px solid var(--accent);outline-offset:2px}
.actbar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:10px 12px;box-shadow:0 -4px 14px rgba(20,26,38,.12)}
.actbar .btn{padding:10px 14px;font-size:15px}
.topbar .brand,.topbar .logout{flex-shrink:0}
.topbar .who{min-width:0;overflow:hidden}
.topbar .who b{overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){ .topbar .brand{font-size:18px} .topbar .brand small{display:none} .monthnav b{min-width:104px;font-size:18px} }
.busy .content{opacity:.55;pointer-events:none}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-align:left}
.stripe.matin{border-left-color:var(--amber)}
.cal-d.vac{border-top:4px solid var(--accent)} .cal-d.mat{border-top:4px solid var(--amber)}
.cal-d.off{background:transparent;border-color:transparent;color:var(--muted)}
.cal-d.off b{font-weight:600}
.cal-d.ok,.cal-d.tit{border-top-color:transparent}
.pgrid tr.count td.vr{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.pgrid tr.count td.vr.green{background:var(--green-soft);color:var(--green)} .pgrid tr.count td.vr.amber{background:var(--amber-soft);color:var(--amber)}
.vacedit{border-top:1px solid var(--line);padding-top:10px}
.vacedit summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
@media (min-width:760px){ .wrap{max-width:980px} .cal-d{min-height:64px} .actbar{position:static;box-shadow:none} .tabbar{width:120px} }
.cal-d.pick{outline:3px solid var(--accent);outline-offset:1px;background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.cal.multi .cal-d.off{border:1px dashed var(--muted)}
.cal.multi .cal-d.vac,.cal.multi .cal-d.mat{opacity:.5}
.todo{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:600px){ .pgrid .nm{min-width:118px;padding:0 6px} .pgrid .nm .badge{display:none} .pgrid .tot{position:static} }
.rule{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13px}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--accent) 0 38%,var(--bg) 38%)}
.login .box{background:var(--surface);border-radius:14px;padding:24px 20px;width:100%;max-width:420px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--accent)}
.demo{display:flex;flex-direction:column;gap:6px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo button:hover{background:var(--surface2)}
.dlist{display:flex;flex-direction:column;gap:0}
.dlist>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.dlist>div:last-child{border-bottom:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav b{font-family:var(--display);font-size:20px;min-width:150px;text-align:center;text-transform:capitalize}
.monthnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px}
.pax-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pax-item:last-child{border-bottom:0}
.av-lg{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av-lg.inactive{background:var(--red-soft);color:var(--red)}
.phone{font-family:var(--body);font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

/* ---- v21 : écran de connexion animé (écusson + logo) et logo dans la barre du haut ---- */
.login{position:relative;overflow:hidden;background:#0b1a3d !important;isolation:isolate}
.login::before{content:"";position:absolute;left:50%;top:150px;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:-2;
  background:repeating-conic-gradient(from 0deg,#17409a 0 9deg,#2360c8 9deg 18deg);animation:lg-rays 120s linear infinite}
.login::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 150px,rgba(120,180,255,.28) 0,rgba(11,26,61,.15) 22%,rgba(11,26,61,.72) 48%,#0b1a3d 80%)}
.login .box{position:relative;margin-top:96px;border-radius:18px;box-shadow:0 18px 50px rgba(3,10,30,.45);padding-top:0;animation:lg-rise .7s cubic-bezier(.2,.8,.2,1) both}
.login .lhead{text-align:center}
.login .lhead .logo{margin-bottom:6px;font-size:38px;letter-spacing:.01em}
.login .lsub{font-size:13px;line-height:1.45;color:var(--muted);font-weight:500}
.login .linkbtn{font-size:13px;font-weight:600;align-self:flex-start;padding:2px 0;min-height:0;color:var(--muted)}
.login .box>.linkbtn+.linkbtn{margin-top:-6px}
.login .btn.primary{padding-block:12px;font-size:15px;justify-content:center;text-align:center}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,#2f6fd6 0 33.3%,#fff 33.3% 66.6%,#d0202f 66.6%)}
.btn{transition:transform .08s ease,filter .12s ease}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.login .tri{display:block;width:84px;height:4px;border-radius:4px;margin:10px auto 0;background:linear-gradient(90deg,#1c3f8f 0 33.3%,#fff 33.3% 66.6%,#d0202f 66.6%);box-shadow:0 0 0 1px var(--line)}
.medal{width:156px;height:156px;margin:-88px auto 12px;position:relative;perspective:800px;animation:lg-float 6s ease-in-out infinite}
.medal::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(120,180,255,.55),rgba(120,180,255,0) 70%);animation:lg-pulse 4s ease-in-out infinite}
.coin{position:absolute;inset:0;transform-style:preserve-3d;animation:lg-coin 14s ease-in-out infinite}
.coin i{position:absolute;inset:0;border-radius:50%;background:#0b1a3d center/104% no-repeat;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 0 0 4px #fff,0 10px 26px rgba(0,0,0,.4)}
.coin .f1{background-image:var(--ecusson)}
.coin .f2{background-image:var(--blogo);transform:rotateY(180deg)}
@keyframes lg-coin{0%,40%{transform:rotateY(0)}50%,90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
@keyframes lg-rays{to{transform:rotate(360deg)}}
@keyframes lg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes lg-pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
@keyframes lg-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.topbar .blogo{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--blogo) center/104% no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
@media (max-width:640px){ .topbar .blogo{width:28px;height:28px} .topbar .brand small{display:none} .topbar .brand{font-size:18px} .topbar{gap:6px} .topbar .logout{padding:5px 7px} }
@media (max-width:360px){ .topbar .blogo{width:24px;height:24px} }
@media (prefers-reduced-motion:reduce){ .login::before,.medal,.medal::before,.coin,.login .box{animation:none} .btn{transition:none} }
</style>

// Comptabilité d'un jour : titulaires présents, réservistes validés, en attente, capacité (8 au total, titulaires compris)
function patrouille(date){
  const b=vacOf(date); const ds=b?S.demandes.filter(d=>d.besoinId===b.id&&member(d.memberId)):[];
  const tit=ds.filter(d=>member(d.memberId).titulaire&&d.statut==='attribuee');
  const att=ds.filter(d=>!member(d.memberId).titulaire&&d.statut==='attribuee');
  const wait=ds.filter(d=>d.statut==='demandee');
  const fixe=!!(b&&b.places>0);   // l'admin peut fixer lui-même le nombre de places d'une vacation
  // Règle : un total de personnes, titulaires compris, selon le nombre de titulaires (voir REG). « max » = total, « cap » = places de réservistes.
  const n=tit.length+att.length; const illim=!fixe&&!REG.limite&&tit.length>0;   // pas de limite : réglage de l'admin
  const max=fixe?b.places:illim?n:tit.length>=2?REG.cap2:tit.length?REG.cap1:0; const cap=illim?999:Math.max(0,max-tit.length);
  const etat=(!tit.length&&!fixe)?'notit':illim?'open':att.length>cap?'over':att.length===cap?'full':'open';
  return {b,tit,att,wait,cap,max,n,fixe,illim,etat,libres:illim?999:Math.max(0,cap-att.length),vide:!ds.filter(d=>d.statut!=='refusee').length};
}
const restantes = b => patrouille(b.date).libres;
function vacPatch(b,k,v){   // modification d'une vacation par l'admin
  const o={};
  if(k==='type'){ const t=TYPES[v]||TYPES.vacation; o.type=v; o.debut=t.debut; o.fin=t.fin; if(!b.libelle||b.libelle===typeOf(b).label) o.libelle=t.label; }
  else if(k==='libelle'){ o.libelle=String(v).trim()||typeOf(b).label; }
  else if(k==='debut'||k==='fin'){ if(!v) return null; o[k]=v; }
  else if(k==='places'){ return {places:Math.max(0,Math.min(40,parseInt(v)||0))}; }
  else return null;
  const d=o.debut||b.debut, f=o.fin||b.fin; let h=(new Date('2000-01-01T'+f)-new Date('2000-01-01T'+d))/3600000; if(h<=0) h+=24; o.duree=h;
  return o;
}

function dossierStatus(v,k){
  if(v) return {cls:'green',label:'OK',rank:0};
  return habOblig(k)?{cls:'red',label:'Obligatoire · manquant',rank:2}:{cls:'grey',label:'—',rank:0};   // seul ce qui est obligatoire compte comme une alerte

}
const frDate = s => new Date(s+'T00:00:00').toLocaleDateString('fr-FR');
const TIRS_REQ = 3; // règle : 3 tirs sur 365 jours glissants
function tirInfo(m){
  const today=iso(TODAY), lim=addDays(today,-365);
  const win=(m.tirs||[]).filter(t=>t.date>lim&&t.date<=today).sort((a,b)=>b.date.localeCompare(a.date));
  const n=win.length, aval=win.filter(t=>!t.ok).length;
  const fin=n>=TIRS_REQ?addDays(win[TIRS_REQ-1].date,364):null; // dernier jour où les 3 tirs comptent encore
  const jours=fin?Math.round((new Date(fin+'T00:00:00')-TODAY)/86400000):0;
  const ok=n>=TIRS_REQ;
  const cls=ok?(jours<=30?'amber':'green'):(n===0?'red':'amber');
  const label=ok?(jours<=30?`${n}/3 · à refaire dans ${jours} j`:`${n}/3 · à jour jusqu’au ${frDate(fin)}`):`${n}/3 · il manque ${TIRS_REQ-n} tir${TIRS_REQ-n>1?'s':''}`;
  return {win,n,aval,fin,jours,ok,cls,label};
}

    if(S.members.some(m=>m.nom===nom&&m.prenom.toLowerCase()===prenom.toLowerCase())){ toast('Cette personne existe déjà'); return; }
    const m={id:nid('m'),nom,prenom,grade:f.grade.value.trim(),role:f.role.value,actif:true,titulaire:false,tel:f.tel.value.trim(),email:f.email.value.trim(),matricule:f.matricule?f.matricule.value.trim():'',aVerifier:{},tirs:[],dossier:{}};
    S.members.push(m); S.paxOpen=m.id; S.addOpen=false; save(); render(); toast(`${prenom} ${nom} ajouté·e`); },
  delPax(id){ if(!isEnc()||id===S.user||id==='m0') return; if(S.confirm!=='del-'+id){ S.confirm='del-'+id; render(); toast('Touche « Confirmer la suppression »'); return; }
    S.confirm=null; S.members=S.members.filter(m=>m.id!==id); S.demandes=S.demandes.filter(d=>d.memberId!==id); S.heures=S.heures.filter(h=>h.memberId!==id); S.paxOpen=null; save(); render(); toast('Réserviste supprimé'); },
  lu(id){ const n=(S.notifs||[]).find(x=>x.id===id); if(n){ (n.lu = n.lu || {})[S.user]=true; save(); render(); } },
  voir(id,date){ const n=(S.notifs||[]).find(x=>x.id===id); if(n) (n.lu = n.lu || {})[S.user]=true; S.tab='besoins'; S.month=date.slice(0,7); S.day=date; save(); render(); document.getElementById('fiche-jour')?.scrollIntoView({block:'nearest'}); },
  go(id,focus){ const el=document.getElementById(id); if(!el) return; el.scrollIntoView({block:'start',behavior:'smooth'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1400); if(focus) setTimeout(()=>document.getElementById(focus)?.focus({preventScroll:true}),450); },
  copy(txt,msg){ if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(msg||'Numéro copié'),()=>toast(txt)); } else toast(txt); },
  credOk(){ S.cred=null; render(); },
  ouvrir(date){ S.tab='besoins'; S.month=date.slice(0,7); S.day=date; S.confirm=null; save(); render(); document.getElementById('fiche-jour')?.scrollIntoView({block:'start',behavior:'smooth'}); },
  exporter(){ if(!isEnc()) return; const ym=moisExport(); if(!ym) return; const bs=S.besoins.filter(b=>b.date.startsWith(ym));
    exportCsv(ym,{besoins:bs,demandes:S.demandes,heures:S.heures.filter(h=>h.date.startsWith(ym))}); toast('Export téléchargé'); },
  refuserHab(id,k){ if(!isEnc()) return; const m=member(id); m.dossier[k]=''; if(m.aVerifier) delete m.aVerifier[k]; save(); render(); toast('Refusé — la case est décochée'); },
  addHab(){ if(!isEnc()) return; const v=habNom(document.getElementById('hab-new')?.value); if(!v){ toast('Écris le nom de l’habilitation'); return; } if(DOSSIER_ITEMS.some(([,l])=>l.toLowerCase()===v.toLowerCase())){ toast('Ce type existe déjà'); return; }
    DOSSIER_ITEMS.push(['h_'+Math.random().toString(36).slice(2,10),v,false]); S.habTypes=DOSSIER_ITEMS.map(x=>x.slice()); save(); render(); toast('Type ajouté'); },
  renHab(k,v){ if(!isEnc()) return; v=habNom(v); const it=DOSSIER_ITEMS.find(x=>x[0]===k); if(!it) return; if(!v){ render(); toast('Le nom ne peut pas être vide'); return; } it[1]=v; S.habTypes=DOSSIER_ITEMS.map(x=>x.slice()); save(); render(); toast('Nom modifié'); },
  delHab(k){ if(!isEnc()) return; if(S.confirm!=='hab-'+k){ S.confirm='hab-'+k; render(); toast('Touche « Confirmer »'); return; } S.confirm=null; setHab(DOSSIER_ITEMS.filter(x=>x[0]!==k)); S.habTypes=DOSSIER_ITEMS.map(x=>x.slice()); save(); render(); toast('Type supprimé'); },
  oblHab(k,v){ if(!isEnc()) return; const it=DOSSIER_ITEMS.find(x=>x[0]===k); if(!it) return; it[2]=!!v; S.habTypes=DOSSIER_ITEMS.map(x=>x.slice()); save(); render(); toast(v?'Marqué obligatoire':'N’est plus obligatoire'); },
  reg(k,v){ if(!isEnc()) return; const o=regNew(k,v); if(!o){ render(); toast('Mets un nombre entre 1 et 40'); return; } setReg(o); S.reglages=Object.assign({},REG); save(); render(); toast('Réglage enregistré'); },
  multi(){ S.multi=S.multi?null:[]; S.confirm=null; render(); },
  multiSemaine(){ if(!S.multi) return; const [y,mo]=S.month.split('-').map(Number); const n=new Date(y,mo,0).getDate(); const today=iso(TODAY);
    S.multi=Array.from({length:n},(_,i)=>dISO(y,mo,i+1)).filter(d=>d>=today&&!vacOf(d)&&![0,6].includes(new Date(d+'T00:00:00').getDay())); render(); if(!S.multi.length) toast('Aucun jour libre du lundi au vendredi ce mois-ci'); },
  multiCreer(type){ if(!isEnc()||!S.multi) return; const t=TYPES[type]||TYPES.vacation; const ds=S.multi.filter(d=>!vacOf(d)); if(!ds.length) return;
    ds.forEach(d=>S.besoins.push({id:nid('b'),date:d,debut:t.debut,fin:t.fin,type,libelle:t.label,lieu:'Paris',places:0,duree:7})); S.multi=null; save(); render(); toast(`${ds.length} vacation${ds.length>1?'s':''} créée${ds.length>1?'s':''}`); },
  alerte(id){ S.alertOpen=S.alertOpen===id?null:id; render(); },
  delNotif(id){ if(!isEnc()) return; S.notifs=(S.notifs||[]).filter(n=>n.id!==id); save(); render(); toast('Message supprimé'); },
  // Export du mois, comme la feuille Excel : une ligne par personne, une colonne par jour, heures et total.
  exportMois(){ const [y,mo]=S.month.split('-').map(Number); const nDays=new Date(y,mo,0).getDate(); const dates=Array.from({length:nDays},(_,i)=>dISO(y,mo,i+1));
    const q=v=>{ v=String(v==null?'':v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const rows=[[monthLabel(S.month).toUpperCase(),'',...dates.map(d=>'DLMMJVS'[new Date(d+'T00:00:00').getDay()]),'Total'],['Nom','Téléphone',...dates.map((_,i)=>i+1),''],
      ['VACATION DU MOIS','',...dates.map(d=>{ const b=vacOf(d); return b?typeOf(b).court:''; }),'']];
    S.members.filter(m=>m.id!=='m0').sort((a,b)=>(a.titulaire?0:1)-(b.titulaire?0:1)||a.nom.localeCompare(b.nom)).forEach(m=>{ let tot=0;
      const c=dates.map(d=>{ const b=vacOf(d); const dm=b&&S.demandes.find(x=>x.besoinId===b.id&&x.memberId===m.id&&x.statut==='attribuee'); if(!dm) return '';
        const h=S.heures.find(x=>x.besoinId===b.id&&x.memberId===m.id&&x.statut!=='refusee'); const v=h?h.heures:(m.titulaire?8:b.duree); tot+=v; return String(v).replace('.',','); });
      rows.push([((m.grade?m.grade+' ':'')+fullName(m)).trim(),m.tel||'',...c,String(tot).replace('.',',')]); });
    const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`planning-bstc-${S.month}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(csv).catch(()=>{});
    toast('Export du mois téléchargé (il s’ouvre dans Excel)'); },
};

  const m=me();
  const tabs=[
    ['planning','Planning','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>'],
    ['besoins','Vacations','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 12v6M9 15h6"/></svg>'],
    ['moi','Moi','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'],

  ];
  if(isEnc()) tabs.push(['gestion','Gestion','<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m16 16 2 2 4-4"/></svg>']);
  const badge = pendingDemandes()+pendingHeures()+pendingHabil();
  app.innerHTML = `
    <header class="topbar">
      <span class="blogo" aria-hidden="true"></span><div class="brand">Planning BSTC<small><span class="w-lg">Brigade des transports · </span>v28</small></div>
      <div class="who"><b>${esc(shortName(m))}</b>${roleLabel(m.role)}</div>
      ${REMOTE?'<button class="logout" onclick="act.refreshNow()" aria-label="Actualiser" title="Actualiser">↻</button>':''}<button class="logout" onclick="act.logout()">Quitter</button>
    </header>
    <div class="main">
      <div class="content"><div class="wrap">${notifBanner()}${({planning:renderPlanning,besoins:renderBesoins,moi:renderMoi,equipe:renderEquipe,gestion:renderGestion})[S.tab]()}</div></div>
      <nav class="tabbar">${tabs.map(([k,l,i])=>`<button class="${S.tab===k?'active':''}" onclick="act.tab('${k}')">${i}${l}${k==='gestion'&&badge?`<span class="dot">${badge}</span>`:''}</button>`).join('')}</nav>

function notifBanner(){
  const today=iso(TODAY); const adm=isEnc();
  const list=(S.notifs||[]).filter(n=>!n.lu?.[S.user]&&n.date>=today&&member(n.memberId)).slice(0,3);
  return list.map(n=>{ const p=patrouille(n.date); const who=esc(fullName(member(n.memberId)));
    return `<div class="card notif" role="status"><div style="min-width:0"><b>${adm?`${who} s’est désisté`:'Une place s’est libérée'}</b>
      <div class="small">${fmtDate(n.date)}${adm?'':` · ${who} s’est désisté`} · ${p.tit.length?`${p.illim?p.n+' présents':`${p.n}/${p.max} présents, ${p.libres} place${p.libres>1?'s':''}`}`:'titulaire à indiquer'}</div></div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn primary sm" onclick="act.voir('${n.id}','${n.date}')">${adm?'Voir le jour':'Je me positionne'}</button><button class="btn sm" onclick="act.lu('${n.id}')">OK</button></div></div>`; }).join('');
}

function monthNav(){ const cur=iso(TODAY).slice(0,7);
  return `<div class="row" style="gap:6px"><div class="monthnav"><button onclick="act.month(-1)" aria-label="Mois précédent">‹</button><b>${monthLabel(S.month)}</b><button onclick="act.month(1)" aria-label="Mois suivant">›</button></div>${S.month!==cur?'<button class="btn sm" onclick="act.thisMonth()">Aujourd’hui</button>':''}</div>`; }
function legend(){ return `<div class="legend"><span><i style="background:var(--accent)"></i>Vacation 15h–22h</span><span><i style="background:var(--amber)"></i>Matin 10h–17h</span><span><i style="background:var(--green)"></i>Validé</span><span><i class="hatch"></i>Dispo posée, en attente</span><span><i style="background:var(--blue)"></i>Titulaire présent</span></div>`; }
function typeBadge(b){ const t=typeOf(b); return `<span class="badge ${t.color}">${t.label}</span>`; }
function vacTitle(b){ const t=typeOf(b); return `${hm(b.debut)} – ${hm(b.fin)}${b.libelle&&b.libelle!==t.label?' · '+esc(b.libelle):''}`; }

function chip(m,cls){ return `<span class="chip ${typeof cls==='string'?cls:''} ${m.id===S.user?'me':''} ${m.actif?'':'inactive'}"><span class="av">${initials(m)}</span>${esc(shortName(m))}</span>`; }
function outBtn(d){ if(!d) return ''; return S.confirm===d.id?`<button class="btn danger sm" onclick="act.retirer('${d.id}')">Confirmer le retrait</button>`:`<button class="btn sm" onclick="act.retirer('${d.id}')">Retirer</button>`; }
function patBadge(p){
  const w=p.wait.length?` · ${p.wait.length} en attente`:'';
  if(p.etat==='notit') return `<span class="badge grey">Pas de titulaire${p.att.length?` · ${p.att.length} validé${p.att.length>1?'s':''}`:''}${w}</span>`;
  // Le compteur compte tout le monde, titulaires compris (ex. 2 titulaires + 5 réservistes = 7/8) ; les dispos en attente ont leur propre étiquette.
  const av = !p.wait.length?'' : isEnc()
    ? `<button class="badge blue abtn" onclick="event.stopPropagation();act.ouvrir('${p.b.date}')" title="Ouvrir la vacation pour valider">${p.wait.length} à valider ›</button>`
    : `<span class="badge grey">${p.wait.length} en attente</span>`;
  const main = p.etat==='full' ? `<span class="badge green">${p.n}/${p.max} · complet</span>`
    : p.etat==='over' ? `<span class="badge red">${p.n}/${p.max} · sureffectif</span>`
    : p.illim ? `<span class="badge amber">${p.n} présent${p.n>1?'s':''} · ouvert</span>`
    : `<span class="badge amber">${p.n}/${p.max} · ${p.libres} place${p.libres>1?'s':''}</span>`;
  return `<span class="row" style="gap:4px;justify-content:flex-end">${av}${main}</span>`;
}
function meter(p){ const n=Math.max(p.max,p.n); return n?`<span class="meter" role="img" aria-label="${p.n} personnes sur ${p.max}, titulaires compris">${Array.from({length:n},(_,i)=>`<i class="${i<p.n?(i>=p.max?'over':'on'):''}"></i>`).join('')}</span>`:''; }
// Ce que l'utilisateur connecté peut faire sur la vacation d'un jour
function myAction(date){
  const m=me(); const b=vacOf(date); if(!b||date<iso(TODAY)||m.id==='m0') return '';
  const d=S.demandes.find(x=>x.besoinId===b.id&&x.memberId===S.user);
  if(d?.statut==='attribuee') return `<span class="badge ${m.titulaire?'blue':'green'}">${m.titulaire?'Présent':'✓ Validé'}</span>${outBtn(d)}`;
  if(d?.statut==='demandee') return `<span class="badge grey">En attente</span>${outBtn(d)}`;
  if(!m.actif) return `<span class="badge red">Compte sans activité</span>`;
  if(d?.statut==='refusee') return `<span class="badge grey">Non retenu</span>`;
  return `<button class="btn primary sm" onclick="act.dispo('${date}')">${m.titulaire?'Je serai présent':m.role==='admin'?'M’ajouter comme réserviste':'Je suis dispo'}</button>`;
}
function alertBadge(m){ const al=alertes(m); const t=tirInfo(m); const n=al.length+(t.ok?0:1); if(!n) return '';
  if(!DOSSIER_ITEMS.some(([k])=>m.dossier[k])&&!(m.tirs||[]).length) return `<span class="badge grey" title="Rien de coché, aucun tir">Dossier vide</span>`;
  const red=al.some(([k])=>dossierStatus(m.dossier[k],k).rank===3)||t.n===0;
  return `<button class="badge ${red?'red':'amber'} abtn" onclick="event.stopPropagation();act.alerte('${m.id}')" aria-expanded="${S.alertOpen===m.id}" title="Voir les alertes du dossier">⚠ ${n}</button>`; }
function alertDetail(m){ if(S.alertOpen!==m.id) return ''; const l=alertes(m).map(([k,lab])=>`${lab} : ${dossierStatus(m.dossier[k],k).label.toLowerCase()}`); const t=tirInfo(m); if(!t.ok) l.push('Tirs : '+t.label);
  return `<div class="small muted adet">${l.map(esc).join('<br>')}</div>`; }
function paxLine(m){ return `<div class="pl" style="min-width:0"><span class="${m.actif?'':'name-inactive'}">${esc(fullName(m))}</span> ${alertBadge(m)}${alertDetail(m)}</div>`; }
// Fiche de la vacation d'un jour : titulaires, compteur, validés, en attente, et les actions selon le profil
function dayPanel(date,noAct){
  const b=vacOf(date); if(!b) return '';

    ? titulaires().map(t=>{const on=p.tit.some(d=>d.memberId===t.id); return `<label class="check"><input type="checkbox" id="tit-${date}-${t.id}" ${on?'checked':''} onchange="act.titPresence('${date}','${t.id}',this.checked)"> ${esc(shortName(t))}</label>`;}).join('')||'<span class="small muted">Aucun titulaire déclaré (Gestion › Réservistes)</span>'
    : (p.tit.length?p.tit.map(d=>chip(member(d.memberId),'tit')).join(''):'<span class="small muted">Aucun titulaire indiqué</span>');
  const capTxt = p.fixe?`${p.max} places au total fixées par l’admin${p.tit.length?'':' · aucun titulaire indiqué'}`:p.tit.length?`${p.tit.length} titulaire${p.tit.length>1?'s':''} présent${p.tit.length>1?'s':''} : ${p.illim?'pas de limite de places':`${p.max} personnes au total, donc ${p.cap} réserviste${p.cap>1?'s':''}`}`:'Aucun titulaire indiqué pour ce jour';

    : `<div class="row" style="gap:6px">${p.att.map(d=>chip(member(d.memberId),'ok')).join('')}</div>`;
  const wait = !p.wait.length?'<span class="small muted">Personne</span>'
    : adm?`<div class="dlist">${p.wait.map(d=>`<div>${paxLine(member(d.memberId))}<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ok sm" onclick="act.attribuer('${d.id}')">Valider</button><button class="btn danger sm" onclick="act.refuser('${d.id}')">Refuser</button></div></div>`).join('')}</div>`
    : `<div class="row" style="gap:6px">${p.wait.map(d=>chip(member(d.memberId),'wait')).join('')}</div>`;
  const dispo=S.members.filter(m=>m.id!=='m0'&&m.actif&&!m.titulaire&&!S.demandes.some(d=>d.besoinId===b.id&&d.memberId===m.id&&d.statut==='attribuee')).sort((x,y)=>x.nom.localeCompare(y.nom));
  const add = adm?`<div class="row" style="gap:8px"><select id="add-${date}" class="dinput" style="max-width:none;flex:1 1 170px" aria-label="Personne à ajouter à la vacation"><option value="">Ajouter quelqu’un à la vacation…</option>${dispo.map(m=>`<option value="${m.id}">${esc(fullName(m))}</option>`).join('')}</select><button class="btn" onclick="act.ajouter('${date}')">Ajouter</button></div>`:'';
  const edit = adm?`<details class="vacedit" ${S.vacEdit===b.id?'open':''} ontoggle="S.vacEdit=this.open?'${b.id}':(S.vacEdit==='${b.id}'?null:S.vacEdit)"><summary>Modifier ou supprimer cette vacation</summary>
      <div class="stack" style="margin-top:8px"><div class="grid2">
        <label class="field">Type<select id="vt-${b.id}" onchange="act.majVac('${b.id}','type',this.value)">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${b.type===k?'selected':''}>${t.label} ${hm(t.debut)}–${hm(t.fin)}</option>`).join('')}</select></label>
        <label class="field">Libellé<input id="vl-${b.id}" value="${esc(b.libelle)}" placeholder="ex. Fête de l’Humanité" onchange="act.majVac('${b.id}','libelle',this.value)"></label>
        <label class="field">Début<input type="time" id="vd-${b.id}" value="${b.debut}" onchange="act.majVac('${b.id}','debut',this.value)"></label>
        <label class="field">Fin<input type="time" id="vf-${b.id}" value="${b.fin}" onchange="act.majVac('${b.id}','fin',this.value)"></label>
        <label class="field">Nombre de places<input type="number" min="0" max="40" inputmode="numeric" id="vp-${b.id}" value="${b.places>0?b.places:''}" placeholder="automatique : ${REG.limite?REG.cap1+' ou '+REG.cap2:'sans limite'}" onchange="act.majVac('${b.id}','places',this.value)"></label></div>
      <div class="small muted">Laisse « places » vide pour la règle habituelle (${regleTxt()}). Mets un nombre total pour en prendre plus ou moins ce jour-là.</div>
      <div><button class="btn danger sm" onclick="act.supprVac('${b.id}')">${S.confirm==='vac-'+b.id?'Confirmer la suppression':'Supprimer la vacation'}</button></div></div></details>`:'';
  return `<div class="card stripe ${b.type} stack fiche" id="fiche-jour">
    <div class="row between"><div><div class="eyebrow">${typeOf(b).label} du</div><h3>${fmtLong(date)}</h3><div class="small muted">${vacTitle(b)} · ${esc(b.lieu||'Paris')}</div></div>${patBadge(p)}</div>
    ${my&&noAct!==true?`<div class="myact">${my}</div>`:''}
    <div class="row" style="gap:6px 14px"><span class="eyebrow">Titulaires</span>${titRow}</div>
    <div class="row small muted" style="gap:8px">${meter(p)}<span>${capTxt}</span></div>
    ${adm&&(p.etat==='full'||p.etat==='over')?'<div class="small muted">Besoin de plus de monde ? Ouvre « Modifier ou supprimer cette vacation » et change le nombre de places.</div>':''}
    <div class="stack" style="gap:4px"><div class="eyebrow">Réservistes validés · ${p.att.length}${p.etat==='notit'||p.illim?'':'/'+p.cap}</div>${att}</div>
    <div class="stack" style="gap:4px"><div class="eyebrow">Dispos en attente · ${p.wait.length}</div>${wait}</div>
    ${add}${edit}
  </div>`;
}

function nextCard(){
  const m=me(); if(!m||m.id==='m0') return ''; const today=iso(TODAY);
  const mine=S.demandes.filter(d=>d.memberId===S.user&&d.statut!=='refusee').map(d=>({d,b:besoin(d.besoinId)})).filter(x=>x.b&&x.b.date>=today).sort((a,b)=>a.b.date.localeCompare(b.b.date));
  const ok=mine.find(x=>x.d.statut==='attribuee'); const att=mine.filter(x=>x.d.statut==='demandee').length;
  if(!ok&&!att) return '';
  if(!ok) return `<div class="card small muted">${att} dispo${att>1?'s':''} en attente de validation par l’admin.</div>`;
  const avec=attribs(ok.b).filter(a=>a.memberId!==S.user).map(a=>shortName(member(a.memberId))).filter(Boolean);
  return `<div class="card next"><div style="min-width:0;flex:1 1 200px"><div class="eyebrow">${m.titulaire?'Ma prochaine présence':'Ma prochaine vacation'}</div><b>${fmtDate(ok.b.date)} · ${hm(ok.b.debut)} – ${hm(ok.b.fin)}</b><div class="small">${avec.length?'Avec '+esc(avec.join(', ')):'Personne d’autre pour l’instant'}${att?` · ${att} autre${att>1?'s':''} dispo${att>1?'s':''} en attente`:''}</div></div></div>`;
}

        <div class="slot stripe ${b.type}"><div class="row between"><span class="t">${typeOf(b).label} · ${vacTitle(b)}</span>${patBadge(p)}</div>
          <div class="row" style="gap:6px">${p.tit.map(a=>chip(member(a.memberId),'tit')).join('')}${p.att.map(a=>chip(member(a.memberId),'ok')).join('')}${p.wait.map(a=>chip(member(a.memberId),'wait')).join('')}${p.vide?'<span class="small muted">Personne pour l’instant</span>':''}</div>
          ${my?`<div class="row" style="gap:6px;justify-content:flex-end">${my}</div>`:''}</div></div>`;

    ${nextCard()}
    ${S.view==='grille'?legend():'<div class="legend"><span><i style="background:var(--green)"></i>Validé</span><span><i style="background:var(--amber)"></i>Dispo en attente de validation</span><span><i style="background:var(--blue)"></i>Titulaire présent</span></div>'}
    ${body}`;

function renderGrille(list){
  const [y,mo]=S.month.split('-').map(Number); const nDays=new Date(y,mo,0).getDate(); const today=iso(TODAY);
  const cells={}; // memberId -> jour -> {h,cls,wait}
  list.forEach(b=>S.demandes.filter(d=>d.besoinId===b.id&&d.statut!=='refusee').forEach(a=>{
    const m=member(a.memberId); if(!m) return; const day=+b.date.slice(8);
    const h=S.heures.find(x=>x.besoinId===b.id&&x.memberId===a.memberId&&x.statut!=='refusee');
    (cells[a.memberId] = cells[a.memberId] || {})[day] = {h: h? h.heures : (m.titulaire?8:b.duree), cls:m.titulaire?'permanence':'vacation', wait:a.statut==='demandee', tit:m.titulaire};
  }));
  const rows=S.members.filter(m=>m.id!=='m0').sort((a,b)=>(a.titulaire?0:1)-(b.titulaire?0:1)||a.nom.localeCompare(b.nom));
  const dates=Array.from({length:nDays},(_,i)=>dISO(y,mo,i+1));
  const we=dates.map((_,i)=>new Date(y,mo-1,i+1).getDay()%6===0);
  const head=dates.map((dt,i)=>`<th class="dayh ${we[i]?'we':''} ${S.day===dt?'sel':''}" onclick="act.day('${dt}')"><div class="small muted" style="font-weight:500">${'DLMMJVS'[new Date(y,mo-1,i+1).getDay()]}</div>${i+1}</th>`).join('');
  const vacRow=`<tr class="count"><td class="nm">Vacation du mois</td>${dates.map(dt=>{const b=vacOf(dt); return b?`<td class="vr ${typeOf(b).color}" title="${typeOf(b).label} ${hm(b.debut)}–${hm(b.fin)}">${typeOf(b).court}</td>`:'<td></td>';}).join('')}<td class="tot"></td></tr>`;
  const body=rows.map(m=>{
    let tot=0;
    const tds=dates.map((dt,i)=>{const c=cells[m.id]?.[i+1]; const mine=m.id===S.user&&dt>=today&&m.actif&&!!vacOf(dt);
      const cls=`${we[i]?'we':''} ${S.day===dt?'sel':''} ${mine?'mine':''}`; const click=`onclick="act.${mine?'cell':'day'}('${dt}')"`;
      if(!c) return `<td class="${cls}" ${click}${mine?' title="Me proposer sur cette vacation"':''}></td>`;
      if(c.wait) return `<td class="wait num ${cls}" ${click} title="Dispo posée — en attente de validation">${c.h}</td>`;
      tot+=c.h; return `<td class="c ${c.cls} num ${cls}" ${click} title="${c.tit?'Titulaire présent':'Validé'}">${c.h}</td>`;}).join('');
    return `<tr><td class="nm ${m.actif?'':'name-inactive'}"><span class="w-lg">${m.grade?esc(m.grade)+' ':''}${esc(m.nom)} ${esc(m.prenom)}</span><span class="w-sm">${esc(shortName(m))}</span>${m.titulaire?' <span class="badge blue">Titulaire</span>':''}</td>${tds}<td class="tot num">${tot||''}</td></tr>`;
  }).join('');
  const pats=dates.map(patrouille);
  const count=`<tr class="count"><td class="nm">Titulaires</td>${pats.map(p=>`<td class="num">${p.tit.length||''}</td>`).join('')}<td class="tot"></td></tr>
    <tr class="count"><td class="nm">Validés / places</td>${pats.map(p=>(!p.b||p.vide)?'<td></td>':`<td class="num ${p.etat}" title="${p.etat==='notit'?'Pas de titulaire':p.etat==='full'?'Complète':p.etat==='over'?'Sureffectif':(p.illim?'Pas de limite':p.libres+' place(s) libre(s)')}">${p.etat==='notit'?'–':pCnt(p)}</td>`).join('')}<td class="tot"></td></tr>
    <tr class="count"><td class="nm">En attente</td>${pats.map(p=>`<td class="num">${p.wait.length||''}</td>`).join('')}<td class="tot"></td></tr>`;
  const sel=S.day&&S.day.startsWith(S.month)&&vacOf(S.day);
  return `<div class="gridwrap"><table class="pgrid"><thead><tr><th class="nm">PAX</th>${head}<th class="tot">Total</th></tr></thead><tbody>${vacRow}${body}${count}</tbody></table></div>
    <p class="small muted" style="margin:0">Comme dans l’Excel : la première ligne donne les vacations du mois, puis une ligne par personne. Touche un jour pour voir le détail.</p>
    ${sel?dayPanel(S.day):''}`;
}

function multiBar(){ const n=S.multi.length;
  return `<div class="actbar" style="flex-wrap:wrap"><div style="min-width:0;flex:1 1 170px"><b>${n?`${n} jour${n>1?'s':''} sélectionné${n>1?'s':''}`:'Touche les jours à créer'}</b><div><button class="linkbtn" style="padding:0;font-size:13px" onclick="act.multiSemaine()">Tous les lundis au vendredis du mois</button></div></div>
    <div class="row" style="gap:6px;flex-wrap:nowrap">${Object.entries(TYPES).map(([k,t])=>`<button class="btn primary" ${n?'':'disabled'} onclick="act.multiCreer('${k}')">+ ${t.label}</button>`).join('')}</div></div>`; }
// Onglet « Vacations » : le calendrier du mois. L'admin crée les vacations, le réserviste se propose dessus.
function renderBesoins(){
  const today=iso(TODAY); const [y,mo]=S.month.split('-').map(Number); const nDays=new Date(y,mo,0).getDate(); const adm=isEnc(); const m=me();
  if(!(S.day&&S.day.startsWith(S.month))){ const first=dISO(y,mo,1), last=dISO(y,mo,nDays);
    const next=S.besoins.filter(b=>b.date.startsWith(S.month)&&b.date>=today).map(b=>b.date).sort()[0];
    S.day = (adm&&today>=first&&today<=last)?today:(next||((today>=first&&today<=last)?today:first)); }
  const lead=(new Date(y,mo-1,1).getDay()+6)%7; // la semaine commence le lundi
  const cells=Array.from({length:nDays},(_,i)=>{ const d=dISO(y,mo,i+1); const b=vacOf(d); const p=patrouille(d);
    const mine=b&&S.demandes.find(x=>x.besoinId===b.id&&x.memberId===S.user&&x.statut!=='refusee');
    const st=mine?(mine.statut==='attribuee'?(m.titulaire?'tit':'ok'):'wait'):'';
    const cnt=!b?'':p.etat==='notit'?(p.att.length?`${p.att.length}/?`:p.wait.length?`+${p.wait.length}`:typeOf(b).court):pCnt(p);
    const lbl=`${fmtLong(d)}${b?', '+typeOf(b).label:', pas de vacation'}${st==='ok'?', validé':st==='wait'?', dispo en attente':st==='tit'?', présent':''}`;
    return `<button class="cal-d ${b?(b.type==='matin'?'mat':'vac'):'off'} ${st} ${d<today?'past':''} ${d===today?'today':''} ${S.multi?(S.multi.includes(d)?'pick':''):(S.day===d?'sel':'')}" onclick="act.pick('${d}')" aria-label="${lbl}" aria-pressed="${S.multi?S.multi.includes(d):S.day===d}"><b class="num">${i+1}</b><span class="cnt ${b?p.etat:''} num">${cnt}</span></button>`; }).join('');
  const sel=S.day&&S.day.startsWith(S.month); const b=sel&&vacOf(S.day); const my=(sel&&!(isEnc()&&me().titulaire))?myAction(S.day):'';
  let bar='';
  if(adm&&S.multi) bar=multiBar();
  else if(sel&&b&&my) bar=`<div class="actbar"><div style="min-width:0"><b>${fmtDate(S.day)}</b><div class="small muted">${typeOf(b).label} ${hm(b.debut)}–${hm(b.fin)}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">${my}</div></div>`;
  else if(sel&&!b&&adm) bar=`<div class="actbar"><div style="min-width:0"><b>${fmtDate(S.day)}</b><div class="small muted">Pas de vacation. Créer :</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">${Object.entries(TYPES).map(([k,t])=>`<button class="btn primary" onclick="act.creerVac('${S.day}','${k}')">+ ${t.label}</button>`).join('')}</div></div>`;
  else if(sel&&!b) bar=`<div class="actbar"><div style="min-width:0"><b>${fmtDate(S.day)}</b><div class="small muted">Pas de vacation ce jour</div></div></div>`;
  return `<div><h2>Vacations du mois</h2><p class="small muted" style="margin:4px 0 0">${adm?'Touche un jour : crée la vacation (Vacation 15h–22h ou Matin 10h–17h), puis gère qui est dessus.':'Touche un jour coloré, puis « Je suis dispo ». L’admin valide : le jour passe en vert.'}</p></div>
    <div class="toolbar between">${monthNav()}${adm?`<button class="btn sm" onclick="act.multi()">${S.multi?'Terminer':'Créer plusieurs jours'}</button>`:''}</div>
    <div class="card stack" style="padding:10px"><div class="cal ${adm&&S.multi?'multi':''}">${['lun','mar','mer','jeu','ven','sam','dim'].map(w=>`<div class="wd">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}${cells}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Vacation</span><span><i style="background:var(--amber)"></i>Matin</span><span><i class="hatch"></i>Ma dispo en attente</span><span><i style="background:var(--green)"></i>Je suis validé</span><span><b class="num">3/5</b> validés / places</span></div></div>
    ${bar}
    ${sel&&b&&!(adm&&S.multi)?dayPanel(S.day,true):''}`;
}

function mesProchaines(){

function renderMoi(){
  const m=me(); const ym=S.month; const y=iso(TODAY).slice(0,4);
  const mineH=S.heures.filter(h=>h.memberId===S.user);
  const sum=(arr)=>arr.reduce((s,h)=>s+h.heures,0);
  const valMois=sum(mineH.filter(h=>h.statut==='validee'&&h.date.startsWith(iso(TODAY).slice(0,7))));
  const attente=sum(mineH.filter(h=>h.statut==='declaree'));
  const valAn=sum(mineH.filter(h=>h.statut==='validee'&&h.date.startsWith(y)));
  const done=S.demandes.filter(d=>d.memberId===S.user&&d.statut==='attribuee').map(d=>besoin(d.besoinId)).filter(b=>b&&b.date<iso(TODAY)).sort((a,b)=>b.date.localeCompare(a.date));
  const aDeclarer=done.filter(b=>!mineH.some(h=>h.besoinId===b.id&&h.statut!=='refusee'));
  const aVenir=S.demandes.filter(d=>d.memberId===S.user&&d.statut==='attribuee').map(d=>besoin(d.besoinId)).filter(b=>b&&b.date>=iso(TODAY)).sort((a,b)=>a.date.localeCompare(b.date));
  const hist=mineH.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);

function exportCsv(ym,D){
  const q=v=>{ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const nb=n=>String(Math.round(n*100)/100).replace('.',',');
  const L=[]; const row=(...c)=>L.push(c.map(q).join(';'));
  row('Planning BSTC',monthLabel(ym)); row();
  row('PLANNING'); row('Date','Type','Horaires','Titulaires','Réservistes validés','En attente');
  D.besoins.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{ const ds=D.demandes.filter(d=>d.besoinId===b.id&&member(d.memberId)); const nm=f=>ds.filter(f).map(d=>fullName(member(d.memberId))).join(', ');
    row(frDate(b.date),b.libelle,hm(b.debut)+' – '+hm(b.fin),nm(d=>d.statut==='attribuee'&&member(d.memberId).titulaire),nm(d=>d.statut==='attribuee'&&!member(d.memberId).titulaire),nm(d=>d.statut==='demandee')); });
  row(); row('HEURES DU MOIS'); row('Nom','Prénom','Grade','Matricule','Vacations validées','Heures validées','Heures en attente');
  const ids=new Set(D.besoins.map(b=>b.id)); const sum=a=>a.reduce((t,h)=>t+h.heures,0);
  S.members.filter(m=>m.id!=='m0').sort((a,b)=>a.nom.localeCompare(b.nom)).forEach(m=>{ const vac=D.demandes.filter(d=>d.memberId===m.id&&d.statut==='attribuee'&&ids.has(d.besoinId)).length; const hs=D.heures.filter(h=>h.memberId===m.id);
    const hv=sum(hs.filter(h=>h.statut==='validee')), ha=sum(hs.filter(h=>h.statut==='declaree')); if(!m.actif&&!vac&&!hv&&!ha) return;
    row(m.nom,m.prenom,m.grade||'',m.matricule||'',vac,nb(hv),nb(ha)); });
  const blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='planning-bstc-'+ym+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  window.__lastCsv=L.join('\n'); }

    <div class="dlist"><div><span class="small muted">Email</span><b style="user-select:all;overflow-wrap:anywhere">${esc(c.email)}</b></div><div><span class="small muted">Mot de passe</span><b class="num" style="user-select:all">${esc(c.pwd)}</b></div></div>
