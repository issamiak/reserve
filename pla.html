        </div>`:''}`;}).join('')}</div>
    ${REMOTE?'':'<div><button class="btn sm" onclick="act.reset()">Réinitialiser la démo</button></div>'}`;
}

/* ===================================================================
   MODE RÉEL — données partagées et comptes (Supabase)
   Chaque action écrit dans la base, puis recharge les données.
   Les règles d'accès sont appliquées par la base (voir supabase.sql).
   =================================================================== */
let sb=null, AUTHU=null, MEROW=null, BUSY=false;
const LOCAL = Object.assign({}, act);   // versions « démo » des actions, réutilisées pour la mise à jour à l'écran
const errMsg = e => { const m=(e&&e.message)||String(e); if(/row-level security|permission denied/i.test(m)) return 'Action non autorisée pour ton profil'; if(/Invalid login credentials/i.test(m)) return 'Email ou mot de passe incorrect'; if(/already registered/i.test(m)) return 'Un compte existe déjà avec cet email'; if(/duplicate key/i.test(m)) return 'Déjà enregistré'; if(/Failed to fetch|NetworkError/i.test(m)) return 'Pas de connexion internet'; if((e&&e.code==='PGRST202')||/Could not find the function/i.test(m)) return 'Lance d’abord le fichier « mise-a-jour-v24.sql » dans Supabase (une seule fois)'; return m; };
function setBusy(b){ BUSY=b; document.getElementById('app').classList.toggle('busy',b); }

let LOADSEQ=0, HAB_ROWS=[], MAT_OK=false, LOADED_FROM='';
const mapB = x=>({id:x.id,date:x.date,debut:String(x.debut).slice(0,5),fin:String(x.fin).slice(0,5),type:x.type,libelle:x.libelle,lieu:x.lieu,places:x.places,duree:Number(x.duree)});
const mapD = x=>({id:x.id,besoinId:x.besoin_id,memberId:x.member_id,statut:x.statut,par:x.par});
const mapH = x=>({id:x.id,besoinId:x.besoin_id,memberId:x.member_id,heures:Number(x.heures),statut:x.statut,validePar:x.valide_par,date:x.date});
// Pour rester léger (quota gratuit), on ne charge pas tout l'historique : les vacations des 2 derniers mois (ou depuis le mois affiché s'il est plus ancien),
// et les heures depuis le 1er janvier. Rien n'est supprimé de la base ; l'export Excel va chercher n'importe quel mois.
function fenetre(){ const t=iso(TODAY); let b=addDays(t,-62); const m=(S.month||t.slice(0,7))+'-01'; if(m<b) b=m; const jan=t.slice(0,4)+'-01-01';
  return {b, d:addDays(b,-200)+'T00:00:00', h:jan<b?jan:b}; }
const lire = (n,win)=>{ const q=sb.from(n).select('*'); return n==='besoins'?q.gte('date',win.b):n==='demandes'?q.gte('created_at',win.d):n==='heures'?q.gte('date',win.h):q; };
async function loadAll(){
  const seq=++LOADSEQ;
  const names=['members','dossiers','tirs','besoins','demandes','heures','notifs','notif_lus'];
  const win=fenetre();
  const [hr,rg,...res]=await Promise.all([sb.from('habilitations').select('*'),sb.from('reglages').select('*'),...names.map(n=>lire(n,win))]);
  if(seq!==LOADSEQ) return MEROW;
  REG_OK=!rg.error&&Array.isArray(rg.data); if(REG_OK) setReg(rg.data[0]);   // réglages des places : lus dans la base si elle les gère, sinon la règle par défaut (6 / 10)
  // types d'habilitation : lus dans la base si elle les gère, sinon la liste de départ reste en place
  if(!hr.error&&Array.isArray(hr.data)){ HAB_DYN=true; HAB_ROWS=hr.data.slice().sort((a,b)=>(a.ordre-b.ordre)||String(a.libelle).localeCompare(String(b.libelle))); setHab(HAB_ROWS.map(r=>[r.cle,r.libelle,r.obligatoire])); OBL_OK=!!(HAB_ROWS[0]&&('obligatoire' in HAB_ROWS[0])); } else { HAB_DYN=false; OBL_OK=false; }   // une lecture plus récente est partie entre-temps : on ne l'écrase pas avec des données plus anciennes
  const T={}; res.forEach((r,i)=>{ if(r.error) throw r.error; T[names[i]]=r.data||[]; });
  const mine=T.members.find(x=>x.user_id===AUTHU.id)||null;
  MAT_OK=!!(T.members[0]&&('matricule' in T.members[0]));   // vrai quand la base a la colonne matricule (script SQL v23 lancé)
  const dos=Object.fromEntries(T.dossiers.map(x=>[x.member_id,x]));
  S.members=T.members.filter(x=>x.approuve).map(x=>{ const dd=dos[x.id]||{}; const dossier={}; DOSSIER_ITEMS.forEach(([k])=>dossier[k]=(HAB_FIXES.includes(k)?dd[k]:(dd.extra||{})[k])||'');
    return {id:x.id,nom:x.nom,prenom:x.prenom,grade:x.grade||'',role:x.role,actif:x.actif,titulaire:x.titulaire,tel:x.tel||'',email:x.email||'',matricule:x.matricule||'',lie:!!x.user_id,dossier,extra:dd.extra||{},aVerifier:dd.a_verifier||{},
      tirs:T.tirs.filter(t=>t.member_id===x.id).map(t=>({id:t.id,date:t.date,ok:t.ok}))}; });
  S.pending=T.members.filter(x=>!x.approuve);
  S.besoins=T.besoins.map(mapB); const vus=new Set(S.besoins.map(b=>b.id));
  S.demandes=T.demandes.map(mapD).filter(d=>vus.has(d.besoinId));
  S.heures=T.heures.map(mapH);
  LOADED_FROM=win.b;
  const lus=new Set(T.notif_lus.map(x=>x.notif_id));
  S.notifs=T.notifs.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(x=>({id:x.id,memberId:x.member_id,date:x.date,lu:(mine&&(lus.has(x.id)||x.member_id===mine.id))?{[mine.id]:true}:{}}));
  S.retraits=S.notifs.slice(0,8).map(x=>({memberId:x.memberId,date:x.date}));
  MEROW=mine; return mine;
}
// Exécute une écriture, recharge, réaffiche. fn renvoie un résultat Supabase (ou une liste).
async function run(fn,msg){
  if(BUSY) return; setBusy(true);
  try{ const rs=[].concat(await fn()); rs.forEach(r=>{ if(r&&r.error) throw r.error; });
    await loadAll(); syncMe();
    setBusy(false); render(); if(msg) toast(typeof msg==='function'?msg():msg); }
  catch(e){ setBusy(false); try{ await loadAll(); }catch(_){} render(); toast('Erreur : '+errMsg(e)); }
}
async function enter(){
  setBusy(true);
  try{ await loadAll();
    if(MEROW&&MEROW.approuve){ S.user=MEROW.id; S.tab=MEROW.role==='admin'?'gestion':'planning'; S.sub='demandes'; S.month=addDays(iso(TODAY),3).slice(0,7); }
    else { S.user=null; S.auth='wait'; } }
  catch(e){ S.user=null; S.authErr=errMsg(e); }
  setBusy(false); render();
}
function syncMe(){ if(!MEROW||!MEROW.approuve){ S.user=null; S.auth='wait'; return; } if(S.user!==MEROW.id){ S.user=MEROW.id; } if(MEROW.role!=='admin'&&S.tab==='gestion') S.tab='planning'; }
let LOADING=false;
let LASTEDIT=0; ['input','focusin','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ LASTEDIT=Date.now(); },true));
// Vrai tant que quelqu'un est en train de saisir : on ne réaffiche pas l'écran sous ses doigts. Un champ resté sélectionné sans saisie ne bloque plus les mises à jour.
function editing(){ const a=document.activeElement; if(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return false; const age=Date.now()-LASTEDIT;
  if(a.type==='date'&&/^tir-/.test(a.id)&&a.value) return true;   // date de tir choisie, pas encore ajoutée
  if(a.tagName==='SELECT'||a.type==='checkbox'||a.type==='date') return age<8000; return age<60000; }
function majToday(){ const n=new Date(); n.setHours(0,0,0,0); if(n.getTime()!==TODAY.getTime()){ TODAY.setTime(n.getTime()); return true; } return false; }
async function refresh(force){ if(!S.user||BUSY||LOADING) return; if(force!==true){ if(document.visibilityState!=='visible') return; if(editing()) return; }
  if(majToday()) force=true;   // l'appli est restée ouverte après minuit
  LOADING=true; try{ const before=JSON.stringify([S.members,S.besoins,S.demandes,S.heures,S.notifs,S.pending,S.user]); await loadAll(); syncMe();
    if(force===true||JSON.stringify([S.members,S.besoins,S.demandes,S.heures,S.notifs,S.pending,S.user])!==before) render(); }catch(e){ if(force===true) toast('Erreur : '+errMsg(e)); } LOADING=false; }

function renderAuth(){
  const head=LOGIN_HEAD;
  const err=S.authErr?`<div class="badge red" style="white-space:normal;border-radius:8px;padding:6px 10px">${esc(S.authErr)}</div>`:'';
  if(AUTHU&&S.auth==='wait') return `<div class="login"><div class="box">${head}
    <div class="card todo"><b>Compte en attente.</b><div class="small" style="margin-top:4px">Un admin doit l’accepter avant que tu puisses voir le planning. Préviens-le, puis touche « Vérifier ».</div></div>
    <div class="small muted">Connecté avec ${esc(AUTHU.email||'')}</div>
    <button class="btn primary" onclick="act.recheck()">Vérifier</button><button class="btn" onclick="act.logout()">Me déconnecter</button></div></div>`;
  if(S.auth==='up') return `<div class="login"><div class="box">${head}
    <form class="stack" onsubmit="act.signUp(event)"><h3>Première installation</h3><p class="small muted" style="margin:0">À utiliser une seule fois, pour créer le compte du premier admin. Ensuite, c’est l’admin qui crée les comptes de tout le monde.</p>${err}
      <div class="grid2"><label class="field">Prénom<input name="prenom" id="au-prenom" required autocomplete="given-name"></label><label class="field">Nom<input name="nom" id="au-nom" required autocomplete="family-name"></label></div>
      <label class="field">Adresse email<input name="email" id="au-email" type="email" required autocomplete="username"></label>
      <label class="field">Mot de passe (6 caractères au moins)<input name="pwd" id="au-pwd" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="btn primary" type="submit">Créer le compte admin</button></form>
    <button class="linkbtn" onclick="act.authMode('in')">J’ai déjà un compte</button></div></div>`;
  return `<div class="login"><div class="box">${head}
    <form class="stack" onsubmit="act.signIn(event)">${err}
      <label class="field">Adresse email<input name="email" id="au-email" type="email" required autocomplete="username"></label>
      <label class="field">Mot de passe<input name="pwd" id="au-pwd" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Se connecter</button></form>
    <p class="small muted" style="margin:0">Pas de compte ? Demande-le à un admin.</p>
    ${location.hash==='#installation'?`<button class="linkbtn" onclick="act.authMode('up')">Première installation</button>`:''}
    <p class="small muted" style="margin:0">Mot de passe oublié ? Un admin t’en donne un nouveau.</p>
    <p class="small muted" style="margin:0">Version 28 · © 2026 Issam AKEZDAW — Tous droits réservés</p></div></div>`;
}
function pendingCard(){ const l=S.pending||[]; if(!l.length) return '';
  return `<div class="card stack" id="comptes-attente" style="border-color:var(--accent);border-width:2px"><div class="row between"><h3>Comptes à accepter</h3><span class="badge red">${l.length} en attente</span></div>
    <p class="small muted" style="margin:0">Ces personnes se sont inscrites elles-mêmes. Accepte uniquement celles que tu connais.</p>
    <div class="dlist">${l.map(x=>`<div><div style="min-width:0"><div style="font-weight:700">${esc((x.nom+' '+x.prenom).trim()||'(sans nom)')}</div><div class="small muted">${esc(x.email||'')}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ok sm" onclick="act.approuver('${x.id}')">Accepter</button><button class="btn danger sm" onclick="act.refuserCompte('${x.id}')">Refuser</button></div></div>`).join('')}</div></div>`; }

const RA = {
  // ---- comptes
  authMode(m){ S.auth=m; S.authErr=''; render(); },
  async signIn(ev){ ev.preventDefault(); const f=ev.target; S.authErr=''; setBusy(true);
    const r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pwd.value}); setBusy(false);
    if(r.error){ S.authErr=errMsg(r.error); render(); return; } AUTHU=r.data.user; await enter(); },
  async signUp(ev){ ev.preventDefault(); const f=ev.target; S.authErr=''; setBusy(true);
    const r=await sb.auth.signUp({email:f.email.value.trim(),password:f.pwd.value,options:{data:{nom:f.nom.value.trim(),prenom:f.prenom.value.trim()}}}); setBusy(false);
    if(r.error){ S.authErr=errMsg(r.error); render(); return; }
    if(!r.data.session){ S.auth='in'; S.authErr='Compte créé. Confirme ton adresse avec le lien reçu par email, puis connecte-toi.'; render(); return; }
    AUTHU=r.data.user; await enter(); },
  async forgot(){ const e=document.getElementById('au-email')?.value.trim(); if(!e){ toast('Écris d’abord ton adresse email'); return; } const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]}); toast(r.error?'Erreur : '+errMsg(r.error):'Email de réinitialisation envoyé'); },
  async recheck(){ await enter(); if(!S.user) toast('Pas encore accepté'); },
  async logout(){ try{ await sb.auth.signOut(); }catch(e){} AUTHU=null; MEROW=null; S.user=null; S.auth='in'; S.authErr=''; render(); },
  async changePwd(){ const el=document.getElementById('me-pwd'); const v=el?el.value:''; if(v.length<6){ toast('6 caractères au moins'); return; }
    const r=await sb.auth.updateUser({password:v}); if(r.error){ toast('Erreur : '+errMsg(r.error)); return; } el.value=''; toast('Mot de passe changé'); },
  login(){}, reset(){},
  async refreshNow(){ await refresh(true); toast('À jour'); },
  tab(t){ S.tab=t; S.confirm=null; render(); refresh(); },
  month(n){ LOCAL.month(n); if(S.month+'-01'<LOADED_FROM) refresh(true); },   // mois plus ancien que ce qui est chargé : on va le chercher
  sub(t){ S.sub=t; S.paxOpen=null; render(); refresh(); },
  approuver(id){ return run(()=>sb.from('members').update({approuve:true}).eq('id',id),'Compte accepté'); },
  refuserCompte(id){ return run(()=>supprCompte(id),'Compte refusé'); },
  // ---- vacations (admin)
  creerVac(date,type){ if(vacOf(date)) return; const t=TYPES[type]||TYPES.vacation; S.day=date;
    return run(()=>sb.from('besoins').insert({date,type,debut:t.debut,fin:t.fin,libelle:t.label,lieu:'Paris',places:0,duree:7}),`${t.label} créée — les réservistes peuvent se proposer`); },
  supprVac(bid){ if(S.confirm!=='vac-'+bid){ S.confirm='vac-'+bid; render(); toast('Touche « Confirmer la suppression »'); return; } S.confirm=null; S.vacEdit=null;
    return run(()=>sb.from('besoins').delete().eq('id',bid),'Vacation supprimée'); },
  majVac(bid,k,v){ const b=besoin(bid); if(!b) return; const o=vacPatch(b,k,v); if(!o) return; return run(()=>sb.from('besoins').update(o).eq('id',bid),'Vacation modifiée'); },
  ajouter(date){ const b=vacOf(date); const mid=document.getElementById('add-'+date)?.value; if(!b||!mid){ toast('Choisis une personne dans la liste'); return; }
    const ex=S.demandes.find(x=>x.besoinId===b.id&&x.memberId===mid);
    return run(()=>ex?sb.from('demandes').update({statut:'attribuee',par:S.user}).eq('id',ex.id):sb.from('demandes').insert({besoin_id:b.id,member_id:mid,statut:'attribuee',par:S.user}),()=>`${shortName(member(mid))} ajouté·e à la vacation`); },
  titPresence(date,mid,on){ const b=vacOf(date); if(!b) return; const ex=S.demandes.find(x=>x.besoinId===b.id&&x.memberId===mid);
    return run(()=>on?(ex?sb.from('demandes').update({statut:'attribuee',par:S.user}).eq('id',ex.id):sb.from('demandes').insert({besoin_id:b.id,member_id:mid,statut:'attribuee',par:S.user})):(ex?sb.from('demandes').delete().eq('id',ex.id):null),
      ()=>{ const p=patrouille(date); return p.tit.length?`${p.tit.length} titulaire${p.tit.length>1?'s':''} : ${p.illim?'pas de limite de places':p.cap+' réservistes possibles'}`:'Plus de titulaire ce jour-là'; }); },
  multiCreer(type){ if(!S.multi) return; const t=TYPES[type]||TYPES.vacation; const ds=S.multi.filter(d=>!vacOf(d)); if(!ds.length) return; S.multi=null;
    return run(()=>Promise.all(ds.map(d=>sb.from('besoins').insert({date:d,type,debut:t.debut,fin:t.fin,libelle:t.label,lieu:'Paris',places:0,duree:7}))),`${ds.length} vacation${ds.length>1?'s':''} créée${ds.length>1?'s':''}`); },
  // ---- dispos
  dispo(date){ const m=me(); const b=vacOf(date); if(!b){ toast('Pas de vacation ce jour'); return; } if(!m.actif) return; const direct=m.role==='admin';
    const ex=S.demandes.find(x=>x.besoinId===b.id&&x.memberId===m.id);
    return run(async()=>{ if(ex){ const r=await sb.from('demandes').delete().eq('id',ex.id); if(r.error) return r; }
      return sb.from('demandes').insert({besoin_id:b.id,member_id:m.id,statut:direct?'attribuee':'demandee'}); }, m.titulaire?'Présence enregistrée':direct?'Tu es sur la vacation':'Dispo posée — l’admin doit la valider'); },
  cell(date){ S.day=date; const b=vacOf(date); const d=b&&S.demandes.find(x=>x.besoinId===b.id&&x.memberId===S.user); if(b&&!d&&me().actif&&date>=iso(TODAY)) return RA.dispo(date); render(); },
  retirer(did){ const d=S.demandes.find(x=>x.id===did); if(!d) return; const m=member(d.memberId); const self=d.memberId===S.user; const val=d.statut==='attribuee'&&!m.titulaire;
    if(self&&val&&S.confirm!==did){ S.confirm=did; render(); toast('Déjà validé : touche « Confirmer le retrait »'); return; }
    S.confirm=null; return run(()=>sb.from('demandes').delete().eq('id',did), !self?`${shortName(m)} retiré·e de la vacation`:val?'Désistement enregistré — l’admin et les collègues sont prévenus':'Retiré du planning'); },
  attribuer(did){ const d=S.demandes.find(x=>x.id===did); if(!d) return; const b=besoin(d.besoinId);
    return run(()=>sb.from('demandes').update({statut:'attribuee',par:S.user}).eq('id',did),()=>{ const p=patrouille(b.date); return `${shortName(member(d.memberId))} validé·e${p.tit.length?` — ${pCnt(p)}${p.etat==='over'?' (sureffectif)':''}`:' — titulaire à indiquer'}`; }); },
  refuser(did){ return run(()=>sb.from('demandes').update({statut:'refusee',par:S.user}).eq('id',did),'Demande refusée'); },
  // ---- heures
  declarer(bid){ const v=parseFloat(document.getElementById('h-'+bid).value); if(!(v>0&&v<=24)){ toast('Indique un nombre d’heures valide'); return; } const b=besoin(bid);
    return run(()=>sb.from('heures').insert({besoin_id:bid,member_id:S.user,heures:v,statut:'declaree',date:b.date}),'Heures déclarées, en attente de validation'); },
  validerH(hid){ return run(()=>sb.from('heures').update({statut:'validee',valide_par:S.user}).eq('id',hid),'Heures validées'); },
  refuserH(hid){ return run(()=>sb.from('heures').update({statut:'refusee',valide_par:S.user}).eq('id',hid),'Déclaration refusée'); },
  // ---- profil, dossier, tirs
  monProfil(k,v){ v=v.trim(); if(k==='tel'&&!/^[0-9 +.]{8,20}$/.test(v)){ render(); toast('Numéro invalide : chiffres et espaces uniquement'); return; } if(k==='email'&&!/^\S+@\S+\.\S+$/.test(v)){ render(); toast('Adresse email invalide'); return; }
    if(k==='email'){ if(isEnc()) return RA.paxField(S.user,'email',v); render(); return; }   // l'email est l'identifiant de connexion : seul l'admin le gère (le sien compris)
    if(k==='matricule'&&!/^[A-Za-z0-9 .\-]{0,20}$/.test(v)){ render(); toast('Matricule invalide : lettres et chiffres uniquement'); return; } if(k==='matricule') return run(()=>sb.rpc('maj_mon_matricule',{p:v}),'Matricule enregistré');
    return run(()=>sb.rpc('maj_mon_profil',{p_tel:k==='tel'?v:null,p_email:null}),'Téléphone mis à jour'); },
  monDossier(k,v){ if(v&&v<'2000-01-01') return; if(v&&v>iso(TODAY)){ toast('Indique la date à laquelle c’est fait, pas une date future'); return; } LOCAL.monDossier(k,v); sb.rpc('maj_mon_dossier',{k,v:v||null}).then(r=>{ if(r.error) toast('Erreur : '+errMsg(r.error)); }); },
  confirmer(id,k){ const av=Object.assign({},member(id).aVerifier); delete av[k]; return run(()=>sb.from('dossiers').update({a_verifier:av}).eq('member_id',id),'Validé'); },
  paxField(id,k,v){ const m=member(id);
    if(k==='email'&&m.lie){   // la personne a déjà un compte : on change aussi son identifiant de connexion (fonction de la base, script v24)
      v=String(v||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(v)){ render(); toast('Adresse email invalide'); return; } if(v===(m.email||'').toLowerCase()){ render(); return; }
      if(S.members.some(x=>x.id!==id&&(x.email||'').toLowerCase()===v)){ render(); toast('Un compte existe déjà avec cet email'); return; }
      return run(async()=>{ const r=await sb.rpc('admin_set_email',{m:id,p_email:v}); if(!r.error&&id===S.user&&AUTHU) AUTHU.email=v; return r; }, id===S.user?'Email modifié — connecte-toi avec le nouveau la prochaine fois':'Email modifié — c’est son nouvel identifiant de connexion'); }
    if(['actif','role','titulaire','tel','nom','prenom','grade','email','matricule'].includes(k)){ if(typeof v==='string') v=v.trim(); if((k==='nom'||k==='prenom')&&!v){ render(); toast('Nom et prénom obligatoires'); return; } if(k==='nom') v=v.toUpperCase(); if(k==='email'&&!v) v=null;
      return run(()=>sb.from('members').update({[k]:v}).eq('id',id), k==='actif'?(v?'Réserviste réactivé':'Marqué sans activité à la BSTC'):'Enregistré'); }
    if(v&&v<'2000-01-01') return; if(v&&v>iso(TODAY)){ toast('Indique la date à laquelle c’est fait, pas une date future'); return; } const av=Object.assign({},m.aVerifier); delete av[k]; LOCAL.paxField(id,k,v);   // date du dossier : pas de rechargement pendant la saisie
    let patch={[k]:v||null,a_verifier:av};
    if(!HAB_FIXES.includes(k)){ const ex=Object.assign({},m.extra); if(v) ex[k]=v; else delete ex[k]; m.extra=ex; patch={extra:ex,a_verifier:av}; }   // type ajouté par l'admin : rangé dans « extra »
    sb.from('dossiers').update(patch).eq('member_id',id).then(r=>{ if(r.error) toast('Erreur : '+errMsg(r.error)); }); },
  addTir(mid){ majToday(); const adm=!!mid; const m=adm?member(mid):me(); const v=document.getElementById(adm?'tir-'+mid:'tir-date')?.value; const today=iso(TODAY);
    if(!v){ toast('Choisis la date du tir'); return; } if(v>today){ toast('La date du tir ne peut pas être dans le futur'); return; } if((m.tirs||[]).some(t=>t.date===v)){ toast('Ce tir est déjà noté'); return; }
    const ok=adm||isEnc();   // un admin n'a pas à valider son propre tir
    return run(async()=>{ const r=await sb.from('tirs').insert({member_id:m.id,date:v,ok}).select(); if(!r.error&&!(r.data&&r.data.length)) return {error:{message:'le tir n’a pas été enregistré par la base'}}; return r; },ok?'Tir ajouté':'Tir ajouté — l’admin va le valider'); },
  delTir(mid,tid){ return run(()=>sb.from('tirs').delete().eq('id',tid),'Tir supprimé'); },
  okTir(mid,tid){ return run(()=>sb.from('tirs').update({ok:true}).eq('id',tid),'Tir validé'); },
  // ---- comptes : l'admin crée tout (fiche + compte de connexion avec mot de passe)
  toggleAdd(){ S.addOpen=!S.addOpen; S.pwdSug='Bstc-'+Math.floor(1000+Math.random()*9000); render(); },
  async addPax(ev){ ev.preventDefault(); const f=ev.target; const nom=f.nom.value.trim().toUpperCase(), prenom=f.prenom.value.trim(), email=f.email.value.trim().toLowerCase(), pwd=f.pwd.value;
    if(!nom||!prenom||!email){ toast('Nom, prénom et email obligatoires'); return; } if(pwd.length<6){ toast('Mot de passe : 6 caractères au moins'); return; }
    if(S.members.some(m=>(m.email||'').toLowerCase()===email)||(S.pending||[]).some(x=>(x.email||'').toLowerCase()===email)){ toast('Un compte existe déjà avec cet email'); return; }
    if(BUSY) return; setBusy(true);
    try{ let r=await sb.from('members').insert({nom,prenom,grade:f.grade.value.trim(),role:f.role.value,tel:f.tel.value.trim(),email,approuve:true,...(MAT_OK&&f.matricule?{matricule:f.matricule.value.trim()}:{})}); if(r.error) throw r.error;
      r=await tmpClient().auth.signUp({email,password:pwd,options:{data:{nom,prenom}}}); if(r.error) throw r.error;
      S.addOpen=false; S.cred={nom:prenom+' '+nom,email,pwd}; await loadAll(); syncMe(); const n=S.members.find(m=>(m.email||'').toLowerCase()===email); if(n) S.paxOpen=n.id;
      setBusy(false); render(); toast('Compte créé'); }
    catch(e){ S.addOpen=false; setBusy(false); try{ await loadAll(); }catch(_){} render(); toast('Erreur : '+errMsg(e)); } },
  async setPwd(id){ const m=member(id); const v=document.getElementById('pwd-'+id)?.value||''; if(v.length<6){ toast('Mot de passe : 6 caractères au moins'); return; } if(!m.email){ toast('Renseigne d’abord son adresse email'); return; }
    if(BUSY) return; setBusy(true);
    try{ const r=m.lie?await sb.rpc('admin_set_password',{m:id,pwd:v}):await tmpClient().auth.signUp({email:m.email,password:v,options:{data:{nom:m.nom,prenom:m.prenom}}}); if(r.error) throw r.error;
      S.cred={nom:m.prenom+' '+m.nom,email:m.email,pwd:v}; await loadAll(); syncMe(); setBusy(false); render(); toast(m.lie?'Mot de passe remplacé':'Compte créé'); document.querySelector('.content').scrollTo({top:0,behavior:'smooth'}); }
    catch(e){ setBusy(false); render(); toast('Erreur : '+errMsg(e)); } },
  delPax(id){ if(id===S.user) return; if(S.confirm!=='del-'+id){ S.confirm='del-'+id; render(); toast('Touche « Confirmer la suppression »'); return; } S.confirm=null; S.paxOpen=null;
    return run(()=>supprCompte(id),'Compte supprimé'); },
  async exporter(){ const ym=moisExport(); if(!ym||BUSY) return; setBusy(true);
    try{ const a=ym+'-01', z=ym+'-'+String(new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate()).padStart(2,'0');
      const rb=await sb.from('besoins').select('*').gte('date',a).lte('date',z); if(rb.error) throw rb.error; const ids=(rb.data||[]).map(x=>x.id);
      const rd=ids.length?await sb.from('demandes').select('*').in('besoin_id',ids):{data:[]}; if(rd.error) throw rd.error;
      const rh=await sb.from('heures').select('*').gte('date',a).lte('date',z); if(rh.error) throw rh.error;
      exportCsv(ym,{besoins:(rb.data||[]).map(mapB),demandes:(rd.data||[]).map(mapD),heures:(rh.data||[]).map(mapH)}); setBusy(false); toast('Export téléchargé'); }
    catch(e){ setBusy(false); toast('Erreur : '+errMsg(e)); } },
  refuserHab(id,k){ const m=member(id); const av=Object.assign({},m.aVerifier); delete av[k]; let patch={[k]:null,a_verifier:av};
    if(!HAB_FIXES.includes(k)){ const ex=Object.assign({},m.extra); delete ex[k]; patch={extra:ex,a_verifier:av}; }
    return run(()=>sb.from('dossiers').update(patch).eq('member_id',id),'Refusé — la case est décochée'); },
  // ---- réglages (admin)
  oblHab(k,v){ if(!OBL_OK){ render(); toast('Lance d’abord « mise-a-jour-v24.sql » dans Supabase'); return; } return run(()=>sb.from('habilitations').update({obligatoire:!!v}).eq('cle',k), v?'Marqué obligatoire':'N’est plus obligatoire'); },
  reg(k,v){ if(!REG_OK){ render(); toast('Lance d’abord « mise-a-jour-v24.sql » dans Supabase'); return; } const o=regNew(k,v); if(!o){ render(); toast('Mets un nombre entre 1 et 40'); return; }
    return run(()=>sb.from('reglages').upsert({id:1,cap1:o.cap1,cap2:o.cap2,limite:o.limite}),'Réglage enregistré'); },
  // ---- types d'habilitation (admin)
  addHab(){ const v=habNom(document.getElementById('hab-new')?.value); if(!v){ toast('Écris le nom de l’habilitation'); return; } if(DOSSIER_ITEMS.some(([,l])=>l.toLowerCase()===v.toLowerCase())){ toast('Ce type existe déjà'); return; }
    const ordre=HAB_ROWS.reduce((n,r)=>Math.max(n,r.ordre||0),0)+1;
    return run(()=>sb.from('habilitations').insert({cle:'h_'+Math.random().toString(36).slice(2,10),libelle:v,ordre}),'Type ajouté'); },
  renHab(k,v){ v=habNom(v); if(!v){ render(); toast('Le nom ne peut pas être vide'); return; } return run(()=>sb.from('habilitations').update({libelle:v}).eq('cle',k),'Nom modifié'); },
  delHab(k){ if(S.confirm!=='hab-'+k){ S.confirm='hab-'+k; render(); toast('Touche « Confirmer »'); return; } S.confirm=null; return run(()=>sb.from('habilitations').delete().eq('cle',k),'Type supprimé'); },
  // ---- notifications
  delNotif(id){ return run(()=>sb.from('notifs').delete().eq('id',id),'Message supprimé'); },
  lu(id){ const n=(S.notifs||[]).find(x=>x.id===id); if(n) n.lu={[S.user]:true}; render(); sb.from('notif_lus').insert({notif_id:id,member_id:S.user}).then(()=>{}); },
  voir(id,date){ S.tab='besoins'; S.month=date.slice(0,7); S.day=date; RA.lu(id); document.getElementById('fiche-jour')?.scrollIntoView({block:'nearest'}); },
};

// Supprime la fiche ET le compte de connexion (fonction SQL v20). Si la fonction n'existe pas encore dans la base, on supprime la fiche comme avant.
async function supprCompte(id){ const r=await sb.rpc('admin_supprimer_compte',{m:id});
  if(r.error&&(r.error.code==='PGRST202'||/admin_supprimer_compte|Could not find the function/i.test(r.error.message||''))) return sb.from('members').delete().eq('id',id);
  return r; }
// Second client, sans session enregistrée : sert à créer le compte d'un collègue sans déconnecter l'admin.
function tmpClient(){ return window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bstc-creation-compte'}}); }

async function boot(){
  if(!REMOTE){ if(Array.isArray(S.habTypes)) setHab(S.habTypes); if(S.reglages) setReg(S.reglages); render(); return; }
  Object.assign(act, RA);
  sb=window.supabase.createClient(CFG.url, CFG.key);
  render();
  try{ const r=await sb.auth.getSession(); if(r.data&&r.data.session){ AUTHU=r.data.session.user; await enter(); } }catch(e){ S.authErr=errMsg(e); render(); }
  setInterval(refresh, 30000);
  document.addEventListener('visibilitychange', refresh);
}
boot();
</script>
</body></html>
