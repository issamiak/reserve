<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Planning BSTC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell — sticky top bar, scrolling content, bottom tab bar on phones (side rail on desktop). */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#e9ecf2; --fg:#151a26; --muted:#5d667a; --line:#d6dae3;
  --accent:#1c3f8f; --accent-fg:#ffffff; --accent-soft:#e3e9f8;
  --red:#c8202f; --red-soft:#fbe4e6; --green:#1d8a4b; --green-soft:#dff3e6; --amber:#b67a00; --amber-soft:#fff1cc;
  --blue:#2f6fd6; --blue-soft:#e0ebfb; --orange:#d9600c; --orange-soft:#fde7d5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1b1f2a; --surface2:#242936; --fg:#eceef3; --muted:#9aa3b5; --line:#323847;
  --accent:#7ea0ee; --accent-fg:#0f1830; --accent-soft:#232d47;
  --red:#ff6b76; --red-soft:#3d1c21; --green:#5fcf8a; --green-soft:#16301f; --amber:#f2c14e; --amber-soft:#3a2e0e;
  --blue:#7fb0ff; --blue-soft:#1c2c48; --orange:#ff9d5c; --orange-soft:#3d2312; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1b1f2a; --surface2:#242936; --fg:#eceef3; --muted:#9aa3b5; --line:#323847;
  --accent:#7ea0ee; --accent-fg:#0f1830; --accent-soft:#232d47;
  --red:#ff6b76; --red-soft:#3d1c21; --green:#5fcf8a; --green-soft:#16301f; --amber:#f2c14e; --amber-soft:#3a2e0e;
  --blue:#7fb0ff; --blue-soft:#1c2c48; --orange:#ff9d5c; --orange-soft:#3d2312; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* app shell */
#app{height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar .brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1}
.topbar .brand small{display:block;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:3px}
.topbar .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.topbar .who b{display:block;font-weight:600}
.topbar .logout{background:transparent;border:1px solid color-mix(in srgb,var(--accent-fg) 45%,transparent);color:var(--accent-fg);border-radius:8px;padding:6px 10px;font-size:13px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.content{flex:1;min-width:0;overflow-y:auto;padding:16px;padding-block:16px 24px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--accent);background:var(--accent-soft)}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 16px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (min-width:760px){
  .main{flex-direction:row-reverse}
  .tabbar{flex-direction:column;border-top:0;border-right:1px solid var(--line);width:110px;padding:12px 8px;justify-content:flex-start;gap:4px}
  .tabbar button{flex:0 0 auto;padding:10px 4px;font-size:12px}
  .tabbar .dot{right:12px}
}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)} .badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)} .badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.orange{background:var(--orange-soft);color:var(--orange)} .badge.grey{background:var(--surface2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px;font-size:13px;background:var(--surface)}
.chip .av{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip.me{border-color:var(--accent);background:var(--accent-soft)}
.chip.inactive{color:var(--red);border-color:var(--red)}
.name-inactive{color:var(--red);font-weight:600}
.stripe{border-left:5px solid var(--line)}
.stripe.renfort{border-left-color:var(--red)} .stripe.vacation{border-left-color:var(--green)} .stripe.formation{border-left-color:var(--amber)} .stripe.evenement{border-left-color:var(--orange)} .stripe.permanence{border-left-color:var(--blue)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--surface2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;font-size:15px;width:100%;min-width:0}
.field input[type=date],.field input[type=time]{min-height:38px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1px dashed var(--line);border-radius:var(--radius)}
.segment{display:inline-flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.segment button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.segment button.active{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.subtabs button.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px}
.day .d{text-align:center;background:var(--surface2);border-radius:8px;padding:6px 0;align-self:start}
.day .d b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.day .d span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.day.today .d{background:var(--accent);color:var(--accent-fg)} .day.today .d span{color:var(--accent-fg)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.slot .t{font-weight:600}

/* Excel-like grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.pgrid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.pgrid th,.pgrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;height:28px;min-width:26px}
.pgrid th{background:var(--surface2);font-weight:600;position:sticky;top:0;z-index:1}
.pgrid th.we,.pgrid td.we{background:color-mix(in srgb,var(--surface2) 60%,var(--surface))}
.pgrid .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 8px;white-space:nowrap;min-width:150px;font-weight:500}
.pgrid th.nm{z-index:3}
.pgrid .tot{font-weight:700;background:var(--surface2);min-width:44px;position:sticky;right:0;z-index:2}
.pgrid td.c{font-weight:700;color:#fff}
.pgrid td.c.renfort{background:var(--red)} .pgrid td.c.vacation{background:var(--green)} .pgrid td.c.formation{background:var(--amber)} .pgrid td.c.evenement{background:var(--orange)} .pgrid td.c.permanence{background:var(--blue)}
.pgrid td.wait{background:repeating-linear-gradient(135deg,var(--surface2) 0 4px,var(--surface) 4px 8px);color:var(--muted);font-weight:600}
.pgrid td.mine{cursor:pointer}
.pgrid td.mine:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.pgrid th.dayh{cursor:pointer}
.pgrid th.sel{background:var(--accent);color:var(--accent-fg)} .pgrid th.sel .muted{color:var(--accent-fg)}
.pgrid td.sel{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.pgrid tr.count td{font-weight:700;font-size:11px;background:var(--surface2)}
.pgrid tr.count td.nm{font-size:12px}
.pgrid tr.count td.full{background:var(--green-soft);color:var(--green)}
.pgrid tr.count td.open{background:var(--amber-soft);color:var(--amber)}
.pgrid tr.count td.over{background:var(--red-soft);color:var(--red)}
.pgrid tr.count td.notit{color:var(--muted)}
.chip.wait{border-style:dashed;color:var(--muted);background:transparent}
.chip.wait .av{background:var(--surface2);color:var(--muted)}
.chip.ok{border-color:var(--red);background:var(--red-soft)}
.chip.ok .av{background:var(--red);color:var(--surface)}
.chip.tit{border-color:var(--blue);background:var(--blue-soft)}
.chip.tit .av{background:var(--blue);color:var(--surface)}
.legend i.hatch{background:repeating-linear-gradient(135deg,var(--surface2) 0 3px,var(--surface) 3px 6px);border:1px dashed var(--muted)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:11px;height:16px;border-radius:3px;border:1px solid var(--line);background:var(--surface2)}
.meter i.on{background:var(--red);border-color:var(--red)}
.meter i.over{background:var(--surface);border:2px solid var(--red)}
.dayrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .d{width:44px;text-align:center;background:var(--surface2);border-radius:8px;padding:4px 0;flex-shrink:0}
.dayrow .d b{display:block;font-family:var(--display);font-size:19px;line-height:1}
.dayrow .d span{font-size:10px;text-transform:uppercase;color:var(--muted)}
.dayrow .mid{flex:1 1 96px;min-width:0}
.dayrow .actn{margin-left:auto;display:flex;align-items:center;gap:6px}
.dinput{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;min-height:38px;max-width:150px;flex-shrink:0}
.dayrow button.mid{background:none;border:0;padding:4px 0;text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dlist>div{flex-wrap:wrap}
.dlist>div>:first-child{flex:1 1 140px;min-width:0}
.dlist .num{white-space:nowrap}
.check{align-items:flex-start}
.check input{flex-shrink:0;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:2px 0}
.cal-d{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.cal-d b{font-family:var(--display);font-size:20px;line-height:1}
.cal-d .cnt{font-size:11px;font-weight:700;line-height:1;min-height:11px;color:var(--muted)}
.cal-d .cnt.full{color:var(--green)} .cal-d .cnt.open{color:var(--amber)} .cal-d .cnt.over{color:var(--red)}
.cal-d.wait{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--surface) 5px 10px);border:1px dashed var(--muted)}
.cal-d.ok{background:var(--red);border-color:var(--red);color:var(--surface)}
.cal-d.tit{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.cal-d.ok .cnt,.cal-d.tit .cnt{color:inherit}
.cal-d.past{opacity:.45}
.cal-d.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cal-d.sel{outline:3px solid var(--accent);outline-offset:1px}
.myact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface2);border-radius:8px;padding:10px}
.myact .btn{flex:1 1 auto;justify-content:center;padding:10px 12px;font-size:15px}
.dlist>.valrow{padding:12px 0;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:10px}
.dlist>.valrow>:first-child{flex:0 0 auto}
.valrow .btn{flex:1;justify-content:center;padding:10px 12px}
.dlist>div>.pl{flex:1 1 230px}
.sm{display:none}
.login .logo{margin-bottom:6px}
@media (max-width:600px){
  .lg{display:none} .sm{display:inline}
  .topbar{padding:8px 12px;gap:8px}
  .topbar .brand{font-size:20px;white-space:nowrap}
  .topbar .brand small{display:inline;margin:0 0 0 6px;font-size:10px;opacity:.7;letter-spacing:.04em}
  .topbar .who{font-size:12px;min-width:0}
  .topbar .who b{white-space:nowrap}
  .topbar .logout{padding:5px 8px}
  .content{padding:12px;padding-block:12px 20px}
  .wrap{gap:12px}
  h2{font-size:20px}
  .monthnav b{min-width:118px;font-size:19px}
  .cal{gap:3px} .cal-d{min-height:44px} .cal-d b{font-size:18px}
  .card{padding:12px}
  .paxdetail{padding-left:0 !important}
  .pgrid .nm{min-width:92px}
  .login{background:var(--accent);padding:16px 12px}
}
.notif{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-color:var(--orange);background:var(--orange-soft)}
.pgrid .hb{padding:0 8px;white-space:nowrap;font-weight:600}
.pgrid th.hb{font-size:11px}
.pgrid td.hb.green{background:var(--green-soft);color:var(--green)} .pgrid td.hb.amber{background:var(--amber-soft);color:var(--amber)}
.pgrid td.hb.red{background:var(--red-soft);color:var(--red)} .pgrid td.hb.grey{color:var(--muted)}
.htab td,.htab th{height:34px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{flex:1 1 auto;justify-content:center;padding:10px 12px}
.flash{outline:3px solid var(--accent);outline-offset:2px}
.actbar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:10px 12px;box-shadow:0 -4px 14px rgba(20,26,38,.12)}
.actbar .btn{padding:10px 14px;font-size:15px}
.topbar .brand,.topbar .logout{flex-shrink:0}
.topbar .who{min-width:0;overflow:hidden}
.topbar .who b{overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){ .topbar .brand{font-size:18px} .topbar .brand small{display:none} .monthnav b{min-width:104px;font-size:18px} }
.todo{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:600px){ .pgrid .nm{min-width:118px;padding:0 6px} .pgrid .nm .badge{display:none} .pgrid .tot{position:static} }
.rule{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13px}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--accent) 0 38%,var(--bg) 38%)}
.login .box{background:var(--surface);border-radius:14px;padding:24px 20px;width:100%;max-width:420px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--accent)}
.demo{display:flex;flex-direction:column;gap:6px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo button:hover{background:var(--surface2)}
.dlist{display:flex;flex-direction:column;gap:0}
.dlist>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.dlist>div:last-child{border-bottom:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav b{font-family:var(--display);font-size:20px;min-width:150px;text-align:center;text-transform:capitalize}
.monthnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px}
.pax-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pax-item:last-child{border-bottom:0}
.av-lg{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av-lg.inactive{background:var(--red-soft);color:var(--red)}
.phone{font-family:var(--body);font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- données de démonstration (issues du fichier Planning_BSTC.xlsx) ---------------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const iso = d => dISO(d.getFullYear(), d.getMonth()+1, d.getDate()); // date locale, jamais UTC
const dISO = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const TYPES = {
  renfort:{label:'Renfort',cls:'renfort',color:'red'},
  vacation:{label:'Vacation',cls:'vacation',color:'green'},
  formation:{label:'Formation',cls:'formation',color:'amber'},

const DOSSIER_ITEMS = [
  ['visite_medicale','Visite médicale'],['habilitation','Habilitation'],
  ['pie','PIE'],['grenades','Grenades'],['baton','Bâton'],
];
const NAMES = [
  ['GOMEZ','Richard','Major','admin'],['WEBER','Didier','','admin'],
  ['AKEZDAW','Issam'],['BONTE','Melanie'],
];
// Octobre 2026 (extrait du fichier) : [jour, heures, code] — R=renfort, V=vacation, F=matin/formation, P=permanence encadrement
const OCT = { 'GOMEZ':[[5,8,'R'],[8,8,'R']], 'WEBER':[[8,8,'R'],[14,8,'R']], 'BONTE':[[8,7,'R']] };
// Renforts posés par les agents, pas encore validés (jours d'octobre)
const OCT_DISPO = {'BONTE':[14]};
// Règle de la patrouille : nombre de renforts selon le nombre de titulaires présents (Richard, Didier)
const CAP = {0:0, 1:5, 2:8};
// Septembre 2026 (passé) : quelques renforts effectués
const SEP = { 'GOMEZ':[[28,8,'R']], 'AKEZDAW':[[28,7,'R']], 'BONTE':[[28,7,'R']] };
const CODE = {R:['renfort','15:00','22:00','Renfort BSTC'],V:['vacation','15:00','22:00','Vacation 15h-22h'],F:['formation','10:00','17:00','Matin 10h-17h'],P:['permanence','09:00','17:00','Permanence encadrement'],E:['evenement','17:00','00:00',"Fête de l'Humanité — Brétigny"]};

function seedState(){
  let seq=1; const id=p=>p+(seq++);
  const T=(d,ok)=>({id:'t'+(seq++),date:addDays(iso(TODAY),d),ok:!!ok}); // une séance de tir, il y a d jours
  const members = NAMES.map((n,i)=>{
    const dossier={};
    DOSSIER_ITEMS.forEach(([k],j)=>{ dossier[k] = addDays(iso(TODAY), 120 + ((i*53+j*37)%300)); });
    if(n[0]==='COQUET') dossier.pie = addDays(iso(TODAY), -20);            // expiré → alerte rouge
    if(n[0]==='THELINEAU') dossier.visite_medicale = addDays(iso(TODAY), 12); // expire bientôt → alerte orange
    if(n[0]==='MAMERI') dossier.tir = '';
    if(n[0]==='AKEZDAW'){ dossier.baton = ''; dossier.grenades = ''; }                                    // non renseigné
    return { id:'m'+(i+1), nom:n[0], prenom:n[1], grade:n[2]||'', role:n[3]||'reserviste', actif: n[0]!=='MAMERI', titulaire: ['GOMEZ','WEBER'].includes(n[0]),
      tel:`06 00 00 ${String(10+i).padStart(2,'0')} ${String((i*37)%90+10).padStart(2,'0')}`, email:`${n[1]}.${n[0]}@exemple.fr`.toLowerCase(), aVerifier: n[0]==='AKEZDAW'?{pie:true}:{}, tirs: n[0]==='AKEZDAW'?[T(-410,1),T(-200,1),T(-40,0)]:n[0]==='BONTE'?[T(-340,1),T(-170,1),T(-25,1)]:[T(-250,1),T(-120,1),T(-30,1)], dossier };
  });
  members.unshift({id:'m0',nom:'BSTC',prenom:'Responsable',grade:'',role:'admin',actif:true,tel:'06 00 00 00 00',tirs:[],aVerifier:{},dossier:{}});
  const byNom = Object.fromEntries(members.map(m=>[m.nom,m]));
  const besoins=[], demandes=[], heures=[];
  const key = {};
  function place(month, data, past){
    for(const [nom, list] of Object.entries(data)){
      const m = byNom[nom]; if(!m) continue;
      for(const [day,h,code] of list){
        const [type,debut,fin,libelle] = CODE[code];
        const k = `${month}-${day}-${code}`;
        let b = key[k];
        if(!b){ b = {id:id('b'), date:dISO(2026,month,day), debut, fin, type, libelle, lieu: code==='E'?'Brétigny-sur-Orge':'Paris', places:0, duree: code==='P'?8:(code==='E'||code==='R'?7:h)}; key[k]=b; besoins.push(b); }
        b.places++;
        demandes.push({id:id('d'), besoinId:b.id, memberId:m.id, statut:'attribuee'});
        if(past){
          const pending = day>=28 || (day===24 && nom==='AKEZDAW');
          if(!(day===24 && nom==='AKEZDAW') && !(day===28 && nom==='AKEZDAW'))
            heures.push({id:id('h'), besoinId:b.id, memberId:m.id, heures:h, statut: pending?'declaree':'validee', validePar: pending?null:'m1', date:b.date});
        }
      }
    }
  }
  place(9, SEP, true); place(10, OCT, false);
  // quelques places encore ouvertes en octobre + besoins de novembre
  for(const [nom,days] of Object.entries(OCT_DISPO)) days.forEach(day=>{
    const date=dISO(2026,10,day); let b=besoins.find(x=>x.type==='renfort'&&x.date===date);
    if(!b){ b={id:id('b'),date,debut:'15:00',fin:'22:00',type:'renfort',libelle:'Renfort BSTC',lieu:'Paris',places:0,duree:7}; besoins.push(b); }
    demandes.push({id:id('d'),besoinId:b.id,memberId:byNom[nom].id,statut:'demandee'});
  });
  const nov = [[19,'F',8]];
  nov.forEach(([day,code,places])=>{
    const [type,debut,fin,libelle]=CODE[code];
    besoins.push({id:id('b'),date:dISO(2026,11,day),debut,fin,type,libelle: code==='E'?'Cérémonie du 11 novembre — sécurisation':(code==='F'?'Formation risques électriques':libelle),lieu:code==='E'?'Paris 8e':'Paris',places,duree:code==='P'?8:7});
  });
  const nb = besoins.filter(b=>b.date.startsWith('2026-11'));
  const req = [];
  req.forEach(([nom,i])=>demandes.push({id:id('d'),besoinId:nb[i].id,memberId:byNom[nom].id,statut:'demandee'}));
  return {seq, members, besoins, demandes, heures, user:null, tab:'planning', month:addDays(iso(TODAY),3).slice(0,7), view:'liste', sub:'demandes', paxOpen:null, retraits:[], notifs:[], day:null};
}

// Comptabilité d'un jour : titulaires présents, renforts attribués, renforts en attente, capacité (5 ou 8)
function patrouille(date){
  const b=renfortOf(date); const ds=b?S.demandes.filter(d=>d.besoinId===b.id&&member(d.memberId)):[];
  const tit=ds.filter(d=>member(d.memberId).titulaire&&d.statut==='attribuee');
  const att=ds.filter(d=>!member(d.memberId).titulaire&&d.statut==='attribuee');
  const wait=ds.filter(d=>d.statut==='demandee');
  const cap=CAP[Math.min(tit.length,2)];
  const etat=!tit.length?'notit':att.length>cap?'over':att.length===cap?'full':'open';
  return {b,tit,att,wait,cap,etat,libres:Math.max(0,cap-att.length),vide:!ds.length};
}
const restantes = b => b.type==='renfort' ? patrouille(b.date).libres : b.places - attribs(b).length;

function dossierStatus(v){
  if(!v) return {cls:'grey',label:'Non renseigné',rank:2};
  const days = Math.round((new Date(v+'T00:00:00')-TODAY)/86400000);
  if(days<0) return {cls:'red',label:`Expiré depuis ${-days} j`,rank:3};
  if(days<=30) return {cls:'amber',label:`Expire dans ${days} j`,rank:1};
  return {cls:'green',label:`Valide jusqu'au ${new Date(v+'T00:00:00').toLocaleDateString('fr-FR')}`,rank:0};
}
const frDate = s => new Date(s+'T00:00:00').toLocaleDateString('fr-FR');
const TIRS_REQ = 3; // règle : 3 tirs sur 365 jours glissants
function tirInfo(m){
  const today=iso(TODAY), lim=addDays(today,-365);
  const win=(m.tirs||[]).filter(t=>t.date>lim&&t.date<=today).sort((a,b)=>b.date.localeCompare(a.date));
  const n=win.length, aval=win.filter(t=>!t.ok).length;
  const fin=n>=TIRS_REQ?addDays(win[TIRS_REQ-1].date,364):null; // dernier jour où les 3 tirs comptent encore
  const jours=fin?Math.round((new Date(fin+'T00:00:00')-TODAY)/86400000):0;
  const ok=n>=TIRS_REQ;
  const cls=ok?(jours<=30?'amber':'green'):(n===0?'red':'amber');
  const label=ok?(jours<=30?`${n}/3 · à refaire dans ${jours} j`:`${n}/3 · à jour jusqu’au ${frDate(fin)}`):`${n}/3 · il manque ${TIRS_REQ-n} tir${TIRS_REQ-n>1?'s':''}`;
  return {win,n,aval,fin,jours,ok,cls,label};
}

function render(){
  const app=$('#app');
  const _k=[S.user,S.tab,S.sub].join('|'); const _c=$('.content'); const _st=(_c&&render._k===_k)?_c.scrollTop:0; render._k=_k;
  if(!S.user){ app.innerHTML=renderLogin(); return; }
  const m=me();
  const tabs=[
    ['planning','Planning','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>'],
    ['besoins','Dispos','<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>'],
    ['moi','Moi','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'],
    ['equipe','Équipe','<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 20c0-3 2-5 5-5"/></svg>'],
  ];
  if(isEnc()) tabs.push(['gestion','Gestion','<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m16 16 2 2 4-4"/></svg>']);
  const badge = pendingDemandes()+pendingHeures()+pendingHabil();
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">Planning BSTC<small><span class="lg">Brigade des transports · </span>v11</small></div>
      <div class="who"><b>${esc(shortName(m))}</b>${roleLabel(m.role)}</div>
      <button class="logout" onclick="act.logout()">Quitter</button>
    </header>
    <div class="main">
      <div class="content"><div class="wrap">${notifBanner()}${({planning:renderPlanning,besoins:renderBesoins,moi:renderMoi,equipe:renderEquipe,gestion:renderGestion})[S.tab]()}</div></div>
      <nav class="tabbar">${tabs.map(([k,l,i])=>`<button class="${S.tab===k?'active':''}" onclick="act.tab('${k}')">${i}${l}${k==='gestion'&&badge?`<span class="dot">${badge}</span>`:''}</button>`).join('')}</nav>
    </div>`;
  if(_st) $('.content').scrollTop=_st;
}

function notifBanner(){
  const today=iso(TODAY); const adm=isEnc();
  const list=(S.notifs||[]).filter(n=>!n.lu?.[S.user]&&n.date>=today&&member(n.memberId)).slice(0,3);
  return list.map(n=>{ const p=patrouille(n.date); const who=esc(fullName(member(n.memberId)));
    return `<div class="card notif" role="status"><div style="min-width:0"><b>${adm?`${who} s’est désisté`:'Une place s’est libérée'}</b>
      <div class="small">${fmtDate(n.date)}${adm?'':` · ${who} s’est désisté`} · ${p.tit.length?`${p.att.length}/${p.cap} validés, ${p.libres} place${p.libres>1?'s':''}`:'titulaire à indiquer'}</div></div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn primary sm" onclick="act.voir('${n.id}','${n.date}')">${adm?'Voir le jour':'Je me positionne'}</button><button class="btn sm" onclick="act.lu('${n.id}')">OK</button></div></div>`; }).join('');
}

function renderLogin(){
  const demo=S.members.map(m=>[m.id,m.id==='m0'?'Responsable BSTC':(m.grade?m.grade+' ':'')+fullName(m),m.role==='admin'?'Admin':'Réserviste']).sort((a,b)=>a[2]===b[2]?0:a[2]==='Réserviste'?-1:1);
  return `<div class="login"><div class="box">
    <div><div class="logo">Planning BSTC</div><div class="eyebrow">Réserve opérationnelle · Brigade des transports</div></div>
    <form class="stack" onsubmit="event.preventDefault();act.login('m3')">
      <label class="field">Adresse email<input id="login-email" type="email" placeholder="prenom.nom@exemple.fr" autocomplete="username"></label>
      <label class="field">Mot de passe<input id="login-pwd" type="password" placeholder="••••••••" autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
    <div><div class="eyebrow" style="margin-bottom:6px">Maquette — choisir un compte de démonstration</div>
      <div class="demo">${demo.map(([id,n,r])=>`<button onclick="act.login('${id}')"><span>${esc(n)}</span><span class="badge ${r==='Réserviste'?'grey':'blue'}">${r}</span></button>`).join('')}</div></div>
    <p class="small muted" style="margin:0">Données de démonstration réduites (2 réservistes et les responsables). Les numéros de téléphone sont fictifs.</p>
    <p class="small muted" style="margin:0"><b>Version 11</b> · 30/09/2026 · tirs, habilitations, gestion des réservistes</p>
  </div></div>`;
}

function monthNav(){ const cur=iso(TODAY).slice(0,7);
  return `<div class="row" style="gap:6px"><div class="monthnav"><button onclick="act.month(-1)" aria-label="Mois précédent">‹</button><b>${monthLabel(S.month)}</b><button onclick="act.month(1)" aria-label="Mois suivant">›</button></div>${S.month!==cur?'<button class="btn sm" onclick="act.thisMonth()">Aujourd’hui</button>':''}</div>`; }
function legend(){ return `<div class="legend">${Object.values(TYPES).map(t=>`<span><i style="background:var(--${t.color})"></i>${t.label}</span>`).join('')}<span><i class="hatch"></i>Posé, en attente</span></div>`; }
function typeBadge(b){ const t=TYPES[b.type]; return `<span class="badge ${t.color}">${t.label}</span>`; }

function chip(m,cls){ return `<span class="chip ${typeof cls==='string'?cls:''} ${m.id===S.user?'me':''} ${m.actif?'':'inactive'}"><span class="av">${initials(m)}</span>${esc(shortName(m))}</span>`; }
function outBtn(d){ if(!d) return ''; return S.confirm===d.id?`<button class="btn danger sm" onclick="act.retirer('${d.id}')">Confirmer le retrait</button>`:`<button class="btn sm" onclick="act.retirer('${d.id}')">Retirer</button>`; }
function patBadge(p){
  const w=p.wait.length?` · ${p.wait.length} en attente`:'';
  if(p.etat==='notit') return `<span class="badge grey">Pas de titulaire${p.att.length?` · ${p.att.length} validé${p.att.length>1?'s':''}`:''}${w}</span>`;
  if(p.etat==='full') return `<span class="badge green">${p.att.length}/${p.cap} · complète</span>`;
  if(p.etat==='over') return `<span class="badge red">${p.att.length}/${p.cap} · sureffectif</span>`;
  return `<span class="badge amber">${p.att.length}/${p.cap} · ${p.libres} place${p.libres>1?'s':''}</span>`;
}
function meter(p){ const n=Math.max(p.cap,p.att.length); return n?`<span class="meter" role="img" aria-label="${p.att.length} renforts attribués sur ${p.cap}">${Array.from({length:n},(_,i)=>`<i class="${i<p.att.length?(i>=p.cap?'over':'on'):''}"></i>`).join('')}</span>`:''; }
// Ce que l'utilisateur connecté peut faire sur le renfort d'un jour
function myAction(date){
  const m=me(); if(date<iso(TODAY)||m.id==='m0') return '';
  const b=renfortOf(date); const d=b&&S.demandes.find(x=>x.besoinId===b.id&&x.memberId===S.user);
  const out=outBtn(d);
  if(d?.statut==='attribuee') return `<span class="badge ${m.titulaire?'blue':'red'}">${m.titulaire?'Présent':'✓ Validé'}</span>${out}`;
  if(d?.statut==='demandee') return `<span class="badge grey">En attente</span>${out}`;
  if(d?.statut==='refusee') return `<span class="badge grey">Non retenu</span>`;
  if(!m.actif) return `<span class="badge red">Compte sans activité</span>`;
  return `<button class="btn primary sm" onclick="act.dispo('${date}')">${m.titulaire?'Je suis présent':'Je pose un renfort'}</button>`;
}
function paxLine(m){ const al=alertes(m); return `<div class="pl" style="min-width:0"><div class="${m.actif?'':'name-inactive'}">${esc(fullName(m))}</div>${al.length?`<div class="row" style="gap:4px;margin-top:2px">${al.map(([k,l])=>{const s=dossierStatus(m.dossier[k]);return `<span class="badge ${s.cls}">${l} · ${s.label.toLowerCase()}</span>`;}).join('')}</div>`:''}</div>`; }
// Fiche d'un jour : titulaires, compteur, attribués, en attente, et les actions selon le rôle
function dayPanel(date,noAct){
  const p=patrouille(date); const future=date>=iso(TODAY); const enc=isEnc()&&future; const my=myAction(date);
  const titRow = enc
    ? titulaires().map(t=>{const on=p.tit.some(d=>d.memberId===t.id); return `<label class="check"><input type="checkbox" id="tit-${date}-${t.id}" ${on?'checked':''} onchange="act.titPresence('${date}','${t.id}',this.checked)"> ${esc(shortName(t))}</label>`;}).join('')
    : (p.tit.length?p.tit.map(d=>chip(member(d.memberId),'tit')).join(''):'<span class="small muted">Aucun titulaire indiqué</span>');
  const capTxt = p.tit.length?`${p.tit.length} titulaire${p.tit.length>1?'s':''} présent${p.tit.length>1?'s':''} : ${p.cap} renforts`:'Aucun titulaire indiqué pour ce jour';
  const att = !p.att.length?'<span class="small muted">Personne pour l’instant</span>'
    : enc?`<div class="dlist">${p.att.map(d=>`<div>${paxLine(member(d.memberId))}<button class="btn sm" onclick="act.desattribuer('${d.id}')">Annuler la validation</button></div>`).join('')}</div>`
    : `<div class="row" style="gap:6px">${p.att.map(d=>chip(member(d.memberId),'ok')).join('')}</div>`;
  const blocked = false;
  const wait = !p.wait.length?'<span class="small muted">Personne</span>'
    : enc?`<div class="dlist">${p.wait.map(d=>`<div>${paxLine(member(d.memberId))}<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ok sm" onclick="act.attribuer('${d.id}')" ${blocked?'disabled':''}>Valider</button><button class="btn danger sm" onclick="act.refuser('${d.id}')">Refuser</button></div></div>`).join('')}</div>`
    : `<div class="row" style="gap:6px">${p.wait.map(d=>chip(member(d.memberId),'wait')).join('')}</div>`;
  const detail = p.vide&&!enc ? `<div class="small muted">${future?'Personne ne s’est encore positionné ce jour-là.':'Rien ce jour-là.'}</div>` : `
    <div class="row" style="gap:6px 14px"><span class="eyebrow">Titulaires</span>${titRow}</div>
    <div class="row small muted" style="gap:8px">${meter(p)}<span>${capTxt}</span></div>
    <div class="stack" style="gap:4px"><div class="eyebrow">Renforts validés · ${p.att.length}${p.tit.length?'/'+p.cap:''}</div>${att}</div>
    <div class="stack" style="gap:4px"><div class="eyebrow">Renforts posés, en attente · ${p.wait.length}</div>${wait}</div>`;
  return `<div class="card stripe renfort stack" id="fiche-jour">
    <div class="row between"><div><div class="eyebrow">Patrouille du</div><h3>${fmtLong(date)}</h3></div>${p.vide?'':patBadge(p)}</div>
    ${my&&noAct!==true?`<div class="myact">${my}</div>`:''}${detail}
  </div>`;
}

function renderPlanning(){
  const list = S.besoins.filter(b=>b.date.startsWith(S.month)).sort((a,b)=>a.date.localeCompare(b.date)||a.debut.localeCompare(b.debut));
  let body;
  if(S.view==='grille') body = renderGrille(list);
  else {
    const shown=list.filter(b=>b.type!=='renfort'||!patrouille(b.date).vide);
    const days=[...new Set(shown.map(b=>b.date))];
    body = days.length? days.map(d=>{
      const dt=new Date(d+'T00:00:00');
      return `<div class="day ${d===iso(TODAY)?'today':''}"><div class="d"><b class="num">${dt.getDate()}</b><span>${dt.toLocaleDateString('fr-FR',{weekday:'short'})}</span></div>
        <div class="stack">${shown.filter(b=>b.date===d).map(b=>{
          if(b.type==='renfort'){ const p=patrouille(d); const my=myAction(d);
            return `<div class="slot stripe renfort"><div class="row between"><span class="t">${hm(b.debut)} – ${hm(b.fin)} · ${esc(b.libelle)}</span>${patBadge(p)}</div>
              <div class="row" style="gap:6px">${p.tit.map(a=>chip(member(a.memberId),'tit')).join('')}${p.att.map(a=>chip(member(a.memberId),'ok')).join('')}${p.wait.map(a=>chip(member(a.memberId),'wait')).join('')}</div>
              ${my?`<div class="row" style="gap:6px;justify-content:flex-end">${my}</div>`:''}</div>`; }
          const at=attribs(b); const r=restantes(b);
          return `<div class="slot stripe ${b.type}"><div class="row between"><span class="t">${hm(b.debut)} – ${hm(b.fin)} · ${esc(b.libelle)}</span>${typeBadge(b)}</div>
            <div class="row" style="gap:6px">${at.length?at.map(a=>chip(member(a.memberId))).join(''):'<span class="small muted">Personne d’attribué</span>'}${r>0&&b.date>=iso(TODAY)?`<span class="badge amber">${r} place${r>1?'s':''} libre${r>1?'s':''}</span>`:''}</div></div>`;
        }).join('')}</div></div>`;
    }).join('') : `<div class="empty">Rien de posé pour ${monthLabel(S.month)}. Va dans « Dispos » pour poser un renfort.</div>`;
  }
  return `<div class="toolbar between">${monthNav()}<div class="row" style="gap:8px"><div class="segment"><button class="${S.view==='liste'?'active':''}" onclick="act.view('liste')">Liste</button><button class="${S.view==='grille'?'active':''}" onclick="act.view('grille')">Grille</button></div>${me().id!=='m0'?'<button class="btn primary sm" onclick="act.tab(\'besoins\')">+ Poser un renfort</button>':''}</div></div>
    ${S.view==='grille'?legend():'<div class="legend"><span><i style="background:var(--red)"></i>Validé</span><span><i class="hatch"></i>Posé, en attente</span><span><i style="background:var(--blue)"></i>Titulaire présent</span></div>'}
    ${body}`;
}

function renderGrille(list){
  const [y,mo]=S.month.split('-').map(Number); const nDays=new Date(y,mo,0).getDate(); const today=iso(TODAY);
  const cells={}; // memberId -> jour -> {h,type,wait}
  list.forEach(b=>S.demandes.filter(d=>d.besoinId===b.id&&d.statut!=='refusee').forEach(a=>{
    const m=member(a.memberId); if(!m) return;
    const day=+b.date.slice(8); const prev=cells[a.memberId]?.[day]; if(prev&&!prev.wait) return;
    const h=S.heures.find(x=>x.besoinId===b.id&&x.memberId===a.memberId&&x.statut!=='refusee');
    (cells[a.memberId] = cells[a.memberId] || {})[day] = {h: h? h.heures : (b.type==='renfort'&&m.titulaire?8:b.duree), type:(b.type==='renfort'&&m.titulaire)?'permanence':b.type, wait:a.statut==='demandee', tit:b.type==='renfort'&&m.titulaire};
  }));
  const rows=S.members.filter(m=>m.id!=='m0').sort((a,b)=>(a.titulaire?0:1)-(b.titulaire?0:1)||a.nom.localeCompare(b.nom));
  const dates=Array.from({length:nDays},(_,i)=>dISO(y,mo,i+1));
  const we=dates.map((_,i)=>new Date(y,mo-1,i+1).getDay()%6===0);
  const head=dates.map((dt,i)=>`<th class="dayh ${we[i]?'we':''} ${S.day===dt?'sel':''}" onclick="act.day('${dt}')"><div class="small muted" style="font-weight:500">${'DLMMJVS'[new Date(y,mo-1,i+1).getDay()]}</div>${i+1}</th>`).join('');
  const body=rows.map(m=>{
    let tot=0;
    const tds=dates.map((dt,i)=>{const c=cells[m.id]?.[i+1]; const mine=m.id===S.user&&dt>=today&&m.actif;
      const cls=`${we[i]?'we':''} ${S.day===dt?'sel':''} ${mine?'mine':''}`; const click=`onclick="act.${mine?'cell':'day'}('${dt}')"`;
      if(!c) return `<td class="${cls}" ${click}${mine?' title="Poser un renfort ce jour-là"':''}></td>`;
      if(c.wait) return `<td class="wait num ${cls}" ${click} title="Renfort posé — en attente d’attribution">${c.h}</td>`;
      tot+=c.h; return `<td class="c ${c.type} num ${cls}" ${click} title="${c.tit?'Titulaire présent':TYPES[c.type].label+' attribué'}">${c.h}</td>`;}).join('');
    return `<tr><td class="nm ${m.actif?'':'name-inactive'}"><span class="lg">${m.grade?esc(m.grade)+' ':''}${esc(m.nom)} ${esc(m.prenom)}</span><span class="sm">${esc(shortName(m))}</span>${m.titulaire?' <span class="badge blue">Titulaire</span>':''}</td>${tds}<td class="tot num">${tot||''}</td></tr>`;
  }).join('');
  const pats=dates.map(patrouille);
  const count=`<tr class="count"><td class="nm">Titulaires</td>${pats.map(p=>`<td class="num">${p.tit.length||''}</td>`).join('')}<td class="tot"></td></tr>
    <tr class="count"><td class="nm">Validés / places</td>${pats.map(p=>p.vide?'<td></td>':`<td class="num ${p.etat}" title="${p.etat==='notit'?'Pas de titulaire':p.etat==='full'?'Patrouille complète':p.etat==='over'?'Sureffectif':p.libres+' place(s) libre(s)'}">${p.etat==='notit'?'–':p.att.length+'/'+p.cap}</td>`).join('')}<td class="tot"></td></tr>
    <tr class="count"><td class="nm">En attente</td>${pats.map(p=>`<td class="num">${p.wait.length||''}</td>`).join('')}<td class="tot"></td></tr>`;
  const sel=S.day&&S.day.startsWith(S.month);
  return `<div class="gridwrap"><table class="pgrid"><thead><tr><th class="nm">PAX</th>${head}<th class="tot">Total</th></tr></thead><tbody>${body}${count}</tbody></table></div>
    <p class="small muted" style="margin:0">Comme dans l’Excel : une ligne par PAX, une colonne par jour. ${me().id!=='m0'?'Touche une case de ta ligne pour poser un renfort. ':''}Touche un jour pour voir la patrouille. Les trois lignes du bas font le compte jour par jour : vert = complète, orange = il reste des places.</p>
    ${sel?dayPanel(S.day):''}`;
}

function renderBesoins(){
  const today=iso(TODAY); const [y,mo]=S.month.split('-').map(Number); const nDays=new Date(y,mo,0).getDate();
  if(!(S.day&&S.day.startsWith(S.month))){ const first=dISO(y,mo,1), last=dISO(y,mo,nDays); S.day = (today>=first&&today<=last)?today:(first>today?first:S.day); }
  const lead=(new Date(y,mo-1,1).getDay()+6)%7; // la semaine commence le lundi
  const m=me();
  const cells=Array.from({length:nDays},(_,i)=>{ const d=dISO(y,mo,i+1); const p=patrouille(d);
    const mine=p.b&&S.demandes.find(x=>x.besoinId===p.b.id&&x.memberId===S.user&&x.statut!=='refusee');
    const st=mine?(mine.statut==='attribuee'?(m.titulaire?'tit':'ok'):'wait'):'';
    const cnt=p.vide?'':p.etat==='notit'?(p.att.length?`${p.att.length}/?`:`+${p.wait.length}`):`${p.att.length}/${p.cap}`;
    const lbl=`${fmtLong(d)}${st==='ok'?', renfort attribué':st==='wait'?', renfort posé en attente':st==='tit'?', présent':''}${p.vide?'':', '+(p.etat==='notit'?p.wait.length+' en attente, pas de titulaire':p.att.length+' attribués sur '+p.cap)}`;
    return `<button class="cal-d ${st} ${d<today?'past':''} ${d===today?'today':''} ${S.day===d?'sel':''}" onclick="act.pick('${d}')" aria-label="${lbl}" aria-pressed="${S.day===d}"><b class="num">${i+1}</b><span class="cnt ${p.etat} num">${cnt}</span></button>`; }).join('');
  const sel=S.day&&S.day.startsWith(S.month);
  const list=S.besoins.filter(b=>b.date>=today&&b.type!=='renfort').sort((a,b)=>a.date.localeCompare(b.date)||a.debut.localeCompare(b.debut));
  const mine=S.demandes.filter(d=>d.memberId===S.user);
  const cards=list.map(b=>{
    const at=attribs(b); const r=restantes(b); const d=mine.find(x=>x.besoinId===b.id);
    const out=outBtn(d);
    let action;
    if(d?.statut==='attribuee') action=`<span class="badge ${TYPES[b.type].color}">✓ Validé</span>${out}`;
    else if(d?.statut==='demandee') action=`<span class="badge grey">En attente</span>${out}`;
    else if(d?.statut==='refusee') action=`<span class="badge grey">Non retenu</span>`;
    else if(m.id==='m0') action='';
    else if(r<=0) action=`<span class="badge grey">Complet</span>`;
    else if(!m.actif) action=`<span class="badge red">Compte sans activité</span>`;
    else action=`<button class="btn primary sm" onclick="act.demander('${b.id}')">Je suis disponible</button>`;
    return `<div class="card stripe ${b.type} stack" style="gap:8px">
      <div class="row between"><div><div class="eyebrow">${fmtDate(b.date)}</div><h3>${hm(b.debut)} – ${hm(b.fin)} · ${esc(b.libelle)}</h3><div class="small muted">${esc(b.lieu)} · ${b.duree} h · ${at.length}/${b.places} attribué${at.length>1?'s':''}</div></div>${typeBadge(b)}</div>
      ${at.length?`<div class="row" style="gap:6px">${at.map(a=>chip(member(a.memberId))).join('')}</div>`:''}
      <div class="row between"><span class="small ${r>0?'':'muted'}">${r>0?`${r} place${r>1?'s':''} libre${r>1?'s':''}`:'Aucune place libre'}</span><span class="row" style="gap:6px">${action}</span></div></div>`;
  }).join('');
  return `<div><h2>Mes renforts</h2><p class="small muted" style="margin:4px 0 0"><b>1.</b> Touche un jour. <b>2.</b> Touche « Je pose un renfort ». <b>3.</b> L’admin valide : le jour passe en rouge.</p></div>
    <div class="toolbar">${monthNav()}</div>
    <div class="card stack" style="padding:10px"><div class="cal">${['lun','mar','mer','jeu','ven','sam','dim'].map(w=>`<div class="wd">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}${cells}</div>
      <div class="legend"><span><i class="hatch"></i>Posé, en attente</span><span><i style="background:var(--red)"></i>Validé</span><span><b class="num">3/5</b> validés / places</span><span><b class="num">+2</b> posés, pas de titulaire</span></div></div>
    ${sel&&myAction(S.day)?`<div class="actbar"><div style="min-width:0"><b>${fmtDate(S.day)}</b><div class="small muted">${patrouille(S.day).vide?'Personne pour l’instant':'Détail plus bas'}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">${myAction(S.day)}</div></div>`:''}
    ${sel?dayPanel(S.day,true):'<div class="empty">Touche un jour du calendrier.</div>'}
    ${cards?`<h3>Événements et formations</h3>${cards}`:''}`;
}

function tirMeter(i){ return `<span class="meter" role="img" aria-label="${i.n} tirs sur 3">${[0,1,2].map(k=>`<i class="${k<i.n?'on':''}"></i>`).join('')}</span>`; }
function mesTirsCard(m){
  if(m.id==='m0') return '';
  const i=tirInfo(m); const old=(m.tirs||[]).length-i.win.length;
  return `<div class="card stack" id="mes-tirs"><div class="row between"><h3>Mes tirs</h3><span class="badge ${i.cls}">${i.label}</span></div>
    <p class="small muted" style="margin:0">Il faut 3 tirs sur les 365 derniers jours. Ajoute chaque séance ; l’admin la valide.</p>
    <div class="row" style="gap:8px">${tirMeter(i)}<span class="small muted">${i.n} tir${i.n>1?'s':''} depuis le ${frDate(addDays(iso(TODAY),-364))}</span></div>
    <div class="dlist">${i.win.map(t=>`<div><span><b>${frDate(t.date)}</b> <span class="small muted">· compte jusqu’au ${frDate(addDays(t.date,364))}</span></span><span class="row" style="gap:6px">${t.ok?'<span class="badge green">Validé</span>':`<span class="badge blue">À valider</span><button class="btn sm" onclick="act.delTir('${m.id}','${t.id}')">Supprimer</button>`}</span></div>`).join('')||'<div class="small muted">Aucun tir sur les 365 derniers jours.</div>'}</div>
    ${old?`<div class="small muted">${old} tir${old>1?'s':''} de plus d’un an ne compte${old>1?'nt':''} plus.</div>`:''}
    <div class="row" style="gap:8px"><input type="date" id="tir-date" class="dinput" max="${iso(TODAY)}" aria-label="Date du tir"><button class="btn primary" onclick="act.addTir()">Ajouter un tir</button></div></div>`;
}
function monProfilCard(m){
  return `<div class="card stack" id="mon-profil"><h3>Mon profil</h3><p class="small muted" style="margin:0">Tes coordonnées, visibles dans l’annuaire de l’équipe. Modifie un champ : c’est enregistré dès que tu en sors.</p>
    <div class="grid2"><label class="field">Téléphone<input id="me-tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(m.tel||'')}" onchange="act.monProfil('tel',this.value)"></label>
    <label class="field">Adresse email<input id="me-email" type="email" autocomplete="email" value="${esc(m.email||'')}" placeholder="prenom.nom@exemple.fr" onchange="act.monProfil('email',this.value)"></label></div>
    <div class="small muted">${esc((m.grade?m.grade+' ':'')+fullName(m))} · ${roleLabel(m.role)}. Nom, grade et rôle sont gérés par l’admin.</div></div>`;
}
function myBadges(m,k){ const s=dossierStatus(m.dossier[k]); return `<span class="badge ${s.cls}">${s.rank===0?'Valide':s.label}</span>${m.aVerifier?.[k]?'<span class="badge blue">À vérifier par l’admin</span>':''}`; }
function myManque(m){ const n=DOSSIER_ITEMS.filter(([k])=>!m.dossier[k]).length; return n?`<span class="badge grey">${n} date${n>1?'s':''} à renseigner</span>`:'<span class="badge green">Complet</span>'; }
function monDossierCard(m){
  if(m.id==='m0') return '';
  return `<div class="card stack" id="mon-dossier"><div class="row between"><h3>Mon dossier</h3><span id="my-manque">${myManque(m)}</span></div>
    <p class="small muted" style="margin:0">Indique pour chaque élément la date de fin de validité. L’admin vérifie ensuite ce que tu as saisi. Seuls toi et l’admin voyez ce dossier.</p>
    <div class="dlist">${DOSSIER_ITEMS.map(([k,l])=>`<div><div style="min-width:0"><label for="my-${k}" style="font-weight:600">${l}</label><div class="row" id="bd-my-${k}" style="gap:4px;margin-top:2px">${myBadges(m,k)}</div></div><input type="date" id="my-${k}" class="dinput" value="${m.dossier[k]||''}" onchange="act.monDossier('${k}',this.value)"></div>`).join('')}</div></div>`;
}
function mesProchaines(){
  const today=iso(TODAY);
  const list=S.demandes.filter(d=>d.memberId===S.user&&d.statut!=='refusee').map(d=>({d,b:besoin(d.besoinId)})).filter(x=>x.b&&x.b.date>=today).sort((a,b)=>a.b.date.localeCompare(b.b.date));
  return `<div class="card stack"><h3>Mes prochaines vacations</h3>${list.length?list.map(({d,b})=>{
    const ok=d.statut==='attribuee'; const others=attribs(b).filter(a=>a.memberId!==S.user).map(a=>member(a.memberId));
    return `<div class="stripe ${ok?b.type:''}" style="padding-left:10px"><div class="row between"><b>${fmtDate(b.date)} · ${hm(b.debut)} – ${hm(b.fin)}</b><span class="row" style="gap:6px">${ok?`<span class="badge ${TYPES[b.type].color}">Validé</span>`:'<span class="badge grey">En attente d’attribution</span>'}${outBtn(d)}</span></div><div class="small">${esc(b.libelle)} · ${esc(b.lieu)}</div>${ok?`<div class="row small muted" style="gap:6px;margin-top:4px">Avec : ${others.length?others.map(m=>chip(m)).join(''):'<span>personne d’autre pour l’instant</span>'}</div>`:''}</div>`;
  }).join(''):'<div class="small muted">Rien de prévu. Va dans « Dispos » pour poser un renfort.</div>'}</div>`;
}

function renderMoi(){
  const m=me(); const ym=S.month; const y=iso(TODAY).slice(0,4);
  const mineH=S.heures.filter(h=>h.memberId===S.user);
  const sum=(arr)=>arr.reduce((s,h)=>s+h.heures,0);
  const valMois=sum(mineH.filter(h=>h.statut==='validee'&&h.date.startsWith(iso(TODAY).slice(0,7))));
  const attente=sum(mineH.filter(h=>h.statut==='declaree'));
  const valAn=sum(mineH.filter(h=>h.statut==='validee'&&h.date.startsWith(y)));
  const done=S.demandes.filter(d=>d.memberId===S.user&&d.statut==='attribuee').map(d=>besoin(d.besoinId)).filter(b=>b&&b.date<iso(TODAY)).sort((a,b)=>b.date.localeCompare(a.date));
  const aDeclarer=done.filter(b=>!mineH.some(h=>h.besoinId===b.id&&h.statut!=='refusee'));
  const aVenir=S.demandes.filter(d=>d.memberId===S.user&&d.statut==='attribuee').map(d=>besoin(d.besoinId)).filter(b=>b&&b.date>=iso(TODAY)).sort((a,b)=>a.date.localeCompare(b.date));
  const hist=mineH.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  const stat={declaree:'<span class="badge amber">En attente</span>',validee:'<span class="badge green">Validé</span>',refusee:'<span class="badge red">Refusé</span>'};
  return `<div class="row" style="gap:12px"><div class="av-lg ${m.actif?'':'inactive'}">${initials(m)}</div><div><h2 class="${m.actif?'':'name-inactive'}">${m.grade?esc(m.grade)+' ':''}${esc(fullName(m))}</h2><div class="small muted">${roleLabel(m.role)}${m.actif?'':' · <b style="color:var(--red)">Plus d’activité à la BSTC</b>'}</div></div></div>
    <div class="quick">${m.id==='m0'?'':`<button class="btn" onclick="act.go('mes-tirs','tir-date')">+ Ajouter un tir</button><button class="btn" onclick="act.go('mon-dossier')">Mon dossier</button>`}<button class="btn" onclick="act.go('mon-profil','me-tel')">Modifier mon profil</button></div>
    ${m.id!=='m0'&&DOSSIER_ITEMS.some(([k])=>!m.dossier[k])?`<div class="card todo row between"><span><b>Ton dossier est incomplet.</b> <span class="small">Il manque ${DOSSIER_ITEMS.filter(([k])=>!m.dossier[k]).length} date(s) de validité.</span></span><button class="btn primary sm" onclick="act.go('mon-dossier')">Compléter</button></div>`:''}
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Mes heures</div><div class="kpi"><div><b class="num">${valMois}</b><span>validées ce mois</span></div><div><b class="num">${attente}</b><span>en attente</span></div><div><b class="num">${valAn}</b><span>validées en ${y}</span></div></div></div>
    ${aDeclarer.length?`<div class="card stack"><h3>À déclarer</h3><p class="small muted" style="margin:0">Saisis le nombre d’heures réellement effectuées. L’admin valide ensuite.</p>
      ${aDeclarer.map(b=>`<div class="row between stripe ${b.type}" style="padding-left:10px"><div><b>${fmtDate(b.date)}</b> · ${esc(b.libelle)}<div class="small muted">${hm(b.debut)} – ${hm(b.fin)}</div></div><div class="row" style="gap:6px"><input id="h-${b.id}" type="number" min="0.5" max="24" step="0.5" value="${b.duree}" style="width:70px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)" aria-label="Heures effectuées"> h <button class="btn primary sm" onclick="act.declarer('${b.id}')">Déclarer</button></div></div>`).join('')}</div>`:''}
    ${mesProchaines()}
    ${monProfilCard(m)}
    ${mesTirsCard(m)}
    ${monDossierCard(m)}
    <div class="card stack"><h3>Historique récent</h3><div class="dlist">${hist.length?hist.map(h=>{const b=besoin(h.besoinId);return `<div><span><b>${fmtDate(h.date)}</b> <span class="small muted">${esc(b?.libelle||'')}</span></span><span class="row" style="gap:8px"><span class="num">${h.heures} h</span>${stat[h.statut]}</span></div>`;}).join(''):'<div class="small muted">Rien pour l’instant.</div>'}</div></div>`;
}

function renderEquipe(){
  const rows=S.members.filter(m=>m.id!=='m0').sort((a,b)=>(a.role==='admin'?0:1)-(b.role==='admin'?0:1)||a.nom.localeCompare(b.nom));
  return `<div><h2>Équipe</h2><p class="small muted" style="margin:4px 0 0">${rows.filter(m=>m.actif).length} personnes actives · appuie sur un numéro pour le copier.</p></div>
    <div class="card" style="padding-block:4px">${rows.map(m=>`<div class="pax-item" style="cursor:default"><div class="av-lg ${m.actif?'':'inactive'}">${initials(m)}</div><div style="flex:1;min-width:0"><div class="${m.actif?'':'name-inactive'}">${m.grade?esc(m.grade)+' ':''}${esc(fullName(m))}</div><div class="small muted">${roleLabel(m.role)}${m.actif?'':' · plus d’activité'}</div></div><button class="btn sm phone" onclick="act.copy('${m.tel}')">${m.tel}</button></div>`).join('')}</div>`;
}

function renderGestion(){
  const subs=[['demandes',`À valider${pendingDemandes()?` (${pendingDemandes()})`:''}`],['heures',`Heures à valider${pendingHeures()?` (${pendingHeures()})`:''}`],['habil',`Habilitations${pendingHabil()?` (${pendingHabil()})`:''}`],['pax','Réservistes'],['besoins','Événements']];
  return `<div class="row between"><h2>Gestion</h2><button class="btn primary" onclick="act.nouveau()">+ Nouveau besoin</button></div>
    <div class="subtabs">${subs.map(([k,l])=>`<button class="${S.sub===k?'active':''}" onclick="act.sub('${k}')">${l}</button>`).join('')}</div>
    ${({demandes:gDemandes,heures:gHeures,habil:gHabil,besoins:gBesoins,pax:gPax})[S.sub]()}`;
}

function gDemandes(){
  const today=iso(TODAY);
  const pendR=S.demandes.filter(d=>d.statut==='demandee'&&besoin(d.besoinId)?.type==='renfort'&&besoin(d.besoinId).date>=today&&member(d.memberId))
    .sort((a,b)=>besoin(a.besoinId).date.localeCompare(besoin(b.besoinId).date));
  const rDates=[...new Set(S.besoins.filter(b=>b.type==='renfort'&&b.date>=today&&!patrouille(b.date).vide).map(b=>b.date))].sort();
  const pend=S.demandes.filter(d=>d.statut==='demandee'&&besoin(d.besoinId)?.type!=='renfort');
  const byB={}; pend.forEach(d=>(byB[d.besoinId] = byB[d.besoinId] || []).push(d));
  const ids=Object.keys(byB).sort((a,b)=>besoin(a).date.localeCompare(besoin(b).date));
  const ret=(S.retraits||[]).filter(r=>member(r.memberId));
  const rows=pendR.map(d=>{ const b=besoin(d.besoinId); const m=member(d.memberId); const p=patrouille(b.date); const al=alertes(m);
    return `<div class="valrow"><div style="min-width:0"><div class="${m.actif?'':'name-inactive'}" style="font-weight:700">${esc(fullName(m))}</div>
        <div><b>${fmtDate(b.date)}</b> <span class="small muted">· ${hm(b.debut)} – ${hm(b.fin)} · ${esc(b.libelle)}</span></div>
        <div class="row" style="gap:4px;margin-top:4px">${patBadge(p)}${tirInfo(m).ok?'':tirBadge(m)}${al.map(([k,l])=>{const s=dossierStatus(m.dossier[k]);return `<span class="badge ${s.cls}">${l} · ${s.label.toLowerCase()}</span>`;}).join('')}</div></div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ok" onclick="act.attribuer('${d.id}')">Valider</button><button class="btn danger" onclick="act.refuser('${d.id}')">Refuser</button></div></div>`; }).join('');
  const autres=ids.map(bid=>{const b=besoin(bid); const r=restantes(b);
    return `<div class="card stripe ${b.type} stack"><div class="row between"><div><div class="eyebrow">${fmtDate(b.date)} · ${hm(b.debut)} – ${hm(b.fin)}</div><h3>${esc(b.libelle)}</h3><div class="small muted">${attribs(b).length}/${b.places} validés · <b>${r} place${r>1?'s':''} restante${r>1?'s':''}</b></div></div>${typeBadge(b)}</div>
      <div class="dlist">${byB[bid].map(d=>`<div>${paxLine(member(d.memberId))}
          <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ok sm" onclick="act.attribuer('${d.id}')" ${r<=0?'disabled':''}>Valider</button><button class="btn danger sm" onclick="act.refuser('${d.id}')">Refuser</button></div></div>`).join('')}</div></div>`;}).join('');
  return `<div class="card stack" id="a-valider" style="border-color:var(--accent);border-width:2px"><div class="row between"><h3>Renforts à valider</h3><span class="badge ${pendR.length?'red':'green'}">${pendR.length?pendR.length+' en attente':'Tout est validé'}</span></div>
      <p class="small muted" style="margin:0">Dès qu’un agent pose un renfort, il arrive ici. Touche « Valider » : sa case passe en rouge sur le planning de tout le monde.</p>
      ${rows?`<div class="dlist">${rows}</div>`:'<div class="empty">Rien à valider pour l’instant.</div>'}</div>
    ${ret.length?`<div class="card stack"><h3>Retraits après validation</h3><div class="dlist">${ret.map(r=>`<div><span><b>${esc(fullName(member(r.memberId)))}</b> s’est retiré</span><span class="small muted">${fmtDate(r.date)} · place libérée</span></div>`).join('')}</div></div>`:''}
    ${rDates.length?`<div><h3>Détail par jour</h3><p class="small muted" style="margin:4px 0 0">Coche les titulaires présents : 5 renforts avec un titulaire, 8 avec deux. Le compteur se met à jour tout seul.</p></div>${rDates.map(dayPanel).join('')}`:''}
    ${autres?`<h3>Événements et formations</h3>${autres}`:''}`;
}

function gHeures(){
  const pend=S.heures.filter(h=>h.statut==='declaree').sort((a,b)=>a.date.localeCompare(b.date));
  const enc=S.members.filter(m=>m.role==='admin').map(m=>m.prenom).join(', ');
  const recent=S.heures.filter(h=>h.statut==='validee'&&h.validePar).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `<p class="small muted" style="margin:0">Seules les heures validées ici comptent dans les compteurs. Valideurs : ${esc(enc)}.</p>
    ${pend.length?`<div class="card stack"><h3>${pend.length} déclaration${pend.length>1?'s':''} en attente</h3><div class="dlist">${pend.map(h=>{const m=member(h.memberId); const b=besoin(h.besoinId); const diff=h.heures!==b.duree;
      return `<div><div><b>${esc(fullName(m))}</b><div class="small muted">${fmtDate(h.date)} · ${esc(b.libelle)} ${hm(b.debut)}–${hm(b.fin)}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="num" style="font-weight:700">${h.heures} h</span>${diff?`<span class="badge amber" title="Différent de la durée prévue">≠ ${b.duree} h</span>`:''}<button class="btn ok sm" onclick="act.validerH('${h.id}')">Valider</button><button class="btn danger sm" onclick="act.refuserH('${h.id}')">Refuser</button></div></div>`;}).join('')}</div></div>`:'<div class="empty">Aucune déclaration d’heures en attente.</div>'}
    <div class="card stack"><h3>Dernières validations</h3><div class="dlist">${recent.map(h=>`<div><span>${esc(fullName(member(h.memberId)))} <span class="small muted">· ${fmtDate(h.date)}</span></span><span class="small muted"><span class="num" style="color:var(--fg);font-weight:600">${h.heures} h</span> · validé par ${esc(member(h.validePar)?.prenom||'')}</span></div>`).join('')}</div></div>`;
}

function gBesoins(){
  const list=S.besoins.filter(b=>b.date>=iso(TODAY)&&b.type!=='renfort').sort((a,b)=>a.date.localeCompare(b.date)||a.debut.localeCompare(b.debut));
  return `<div class="card stack" id="nb-form" style="border-color:var(--accent)"><h3>Nouveau besoin</h3><p class="small muted" style="margin:0">Les renforts n’ont pas besoin d’être publiés : chacun les pose librement, jour par jour. Publie ici les événements, formations et permanences, avec un nombre de places.</p>
    <form class="stack" onsubmit="act.creerBesoin(event)">
      <div class="grid2"><label class="field">Date<input name="date" id="nb-date" type="date" required value="${addDays(iso(TODAY),7)}"></label>
        <label class="field">Type<select name="type" id="nb-type">${Object.entries(TYPES).filter(([k])=>k!=='renfort').map(([k,t])=>`<option value="${k}">${t.label}</option>`).join('')}</select></label>
        <label class="field">Début<input name="debut" id="nb-debut" type="time" value="15:00" required></label><label class="field">Fin<input name="fin" id="nb-fin" type="time" value="22:00" required></label>
        <label class="field">Places<input name="places" id="nb-places" type="number" min="1" max="30" value="4"></label><label class="field">Lieu<input name="lieu" id="nb-lieu" placeholder="Paris"></label></div>
      <label class="field">Libellé<input name="libelle" id="nb-libelle" placeholder="Ex. Fête de l’Humanité, Formation risques électriques"></label>
      <div><button class="btn primary" type="submit">Publier le besoin</button></div></form></div>
    <div class="card stack"><h3>Événements à venir (${list.length})</h3><div class="dlist">${list.map(b=>`<div><div><b>${fmtDate(b.date)}</b> ${hm(b.debut)}–${hm(b.fin)} · ${esc(b.libelle)}<div class="small muted">${attribs(b).length}/${b.places} attribués · ${S.demandes.filter(d=>d.besoinId===b.id&&d.statut==='demandee').length} en attente</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">${typeBadge(b)}<button class="btn danger sm" onclick="act.supprBesoin('${b.id}')">Suppr.</button></div></div>`).join('')||'<div class="small muted">Aucun.</div>'}</div></div>`;
}

function gHabil(){
  const rows=S.members.filter(m=>m.id!=='m0').sort((a,b)=>a.nom.localeCompare(b.nom));
  const pend=[];
  rows.forEach(m=>{
    DOSSIER_ITEMS.forEach(([k,l])=>{ if(m.aVerifier?.[k]&&m.dossier[k]) pend.push({m,html:`<b>${l}</b> <span class="small muted">· valide jusqu’au ${frDate(m.dossier[k])}</span>`,on:`act.confirmer('${m.id}','${k}')`}); });
    (m.tirs||[]).filter(t=>!t.ok).forEach(t=>pend.push({m,html:`<b>Tir</b> <span class="small muted">· séance du ${frDate(t.date)}</span>`,on:`act.okTir('${m.id}','${t.id}')`}));
  });
  const d2=v=>v?new Date(v+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
  const cell=(m,k)=>{ const s=dossierStatus(m.dossier[k]); return `<td class="hb ${s.cls} num" title="${s.label}">${d2(m.dossier[k])}${m.aVerifier?.[k]?' ●':''}</td>`; };
  return `<div class="card stack" id="habil-a-valider" style="border-color:var(--accent);border-width:2px"><div class="row between"><h3>Habilitations à valider</h3><span class="badge ${pend.length?'red':'green'}">${pend.length?pend.length+' en attente':'Tout est validé'}</span></div>
      <p class="small muted" style="margin:0">Chaque date ou tir saisi par un agent arrive ici. Vérifie, puis valide.</p>
      ${pend.length?`<div class="dlist">${pend.map(x=>`<div><div style="min-width:0"><div style="font-weight:700">${esc(fullName(x.m))}</div><div>${x.html}</div></div><button class="btn ok" onclick="${x.on}">Valider</button></div>`).join('')}</div>`:'<div class="empty">Rien à valider pour l’instant.</div>'}</div>
    <div><h3>Habilitations de chacun</h3><p class="small muted" style="margin:4px 0 0">Date de fin de validité par personne. Touche un nom pour ouvrir son dossier.</p></div>
    <div class="gridwrap"><table class="pgrid htab"><thead><tr><th class="nm">PAX</th>${DOSSIER_ITEMS.map(([k,l])=>`<th class="hb">${l}</th>`).join('')}<th class="hb">Tirs / 365 j</th></tr></thead>
      <tbody>${rows.map(m=>{ const i=tirInfo(m); return `<tr><td class="nm ${m.actif?'':'name-inactive'}" style="cursor:pointer" onclick="act.openPax('${m.id}')"><span class="lg">${esc(fullName(m))}</span><span class="sm">${esc(shortName(m))}</span></td>${DOSSIER_ITEMS.map(([k])=>cell(m,k)).join('')}<td class="hb ${i.cls} num" title="${i.label}">${i.n}/3${i.aval?' ●':''}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--green)"></i>Valide</span><span><i style="background:var(--amber)"></i>Expire dans 30 j ou moins</span><span><i style="background:var(--red)"></i>Expiré</span><span>— non renseigné</span><span>● saisi par l’agent, à valider</span></div>`;
}

function gPax(){
  const rows=S.members.filter(m=>m.id!=='m0').sort((a,b)=>a.nom.localeCompare(b.nom));
  const nRes=rows.filter(m=>m.role!=='admin').length;
  const form=S.addOpen?`<form class="card stack" id="np-form" style="border-color:var(--accent)" onsubmit="act.addPax(event)"><h3>Nouveau réserviste</h3>
      <div class="grid2"><label class="field">Nom<input name="nom" id="np-nom" required autocomplete="off"></label><label class="field">Prénom<input name="prenom" id="np-prenom" required autocomplete="off"></label>
        <label class="field">Grade<input name="grade" id="np-grade" placeholder="facultatif"></label><label class="field">Profil<select name="role" id="np-role"><option value="reserviste">Réserviste</option><option value="admin">Admin</option></select></label>
        <label class="field">Téléphone<input name="tel" id="np-tel" type="tel" inputmode="tel"></label><label class="field">Adresse email<input name="email" id="np-email" type="email" placeholder="sert d’identifiant de connexion"></label></div>
      <div class="row" style="gap:8px"><button class="btn primary" type="submit">Créer le compte</button><button class="btn" type="button" onclick="act.toggleAdd()">Annuler</button></div></form>`:'';
  return `<div class="row between"><div><h3>${nRes} réserviste${nRes>1?'s':''} · ${rows.length-nRes} admin${rows.length-nRes>1?'s':''}</h3><div class="small muted">${rows.filter(m=>!m.actif).length} sans activité</div></div>${S.addOpen?'':'<button class="btn primary" onclick="act.toggleAdd()">+ Ajouter un réserviste</button>'}</div>
    ${form}
    <div class="card" style="padding-block:4px">${rows.map(m=>{const al=alertes(m); const open=S.paxOpen===m.id; const ti=tirInfo(m); const nv=Object.values(m.aVerifier||{}).filter(Boolean).length+(m.tirs||[]).filter(t=>!t.ok).length;
      return `<div class="pax-item" onclick="act.pax('${m.id}')"><div class="av-lg ${m.actif?'':'inactive'}">${initials(m)}</div><div style="flex:1;min-width:0"><div class="${m.actif?'':'name-inactive'}">${m.grade?esc(m.grade)+' ':''}${esc(fullName(m))}</div><div class="small muted">${roleLabel(m.role)}${m.titulaire?' · titulaire':''}${m.actif?'':' · plus d’activité à la BSTC'}</div></div>
        ${!m.actif?'':(al.length||!ti.ok)?`<span class="badge ${al.some(([k])=>dossierStatus(m.dossier[k]).rank===3)||ti.n===0?'red':'amber'}">${al.length+(ti.ok?0:1)} alerte${al.length+(ti.ok?0:1)>1?'s':''}</span>`:'<span class="badge green">À jour</span>'}${nv?`<span class="badge blue">${nv} à valider</span>`:''}<span class="muted">${open?'▾':'▸'}</span></div>
        ${open?`<div class="stack paxdetail" style="padding:6px 0 14px 46px" onclick="event.stopPropagation()">
          <div class="grid2"><label class="field">Nom<input id="nom-${m.id}" value="${esc(m.nom)}" onchange="act.paxField('${m.id}','nom',this.value)"></label><label class="field">Prénom<input id="prenom-${m.id}" value="${esc(m.prenom)}" onchange="act.paxField('${m.id}','prenom',this.value)"></label>
          <label class="field">Grade<input id="grade-${m.id}" value="${esc(m.grade||'')}" onchange="act.paxField('${m.id}','grade',this.value)"></label><label class="field">Profil<select id="role-${m.id}" ${m.id===S.user?'disabled':''} onchange="act.paxField('${m.id}','role',this.value)">${['reserviste','admin'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></label>
          <label class="field">Téléphone<input id="tel-${m.id}" type="tel" value="${esc(m.tel||'')}" onchange="act.paxField('${m.id}','tel',this.value)"></label><label class="field">Adresse email<input id="email-${m.id}" type="email" value="${esc(m.email||'')}" onchange="act.paxField('${m.id}','email',this.value)"></label></div>
          <label class="check"><input type="checkbox" id="tit-${m.id}" ${m.titulaire?'checked':''} onchange="act.paxField('${m.id}','titulaire',this.checked)"> <span><span style="font-weight:600">Titulaire</span> <span class="small muted">(sa présence ouvre la patrouille : 5 renforts à un, 8 à deux)</span></span></label>
          <label class="check"><input type="checkbox" id="actif-${m.id}" ${m.actif?'':'checked'} onchange="act.paxField('${m.id}','actif',!this.checked)"> <span><span style="color:var(--red);font-weight:600">N’a plus d’activité à la BSTC</span> <span class="small muted">(nom affiché en rouge partout)</span></span></label>
          <div class="eyebrow">Dates de validité</div>
          <div class="grid2">${DOSSIER_ITEMS.map(([k,l])=>{const s=dossierStatus(m.dossier[k]);return `<label class="field">${l} <span class="badge ${s.cls}" id="bd-${m.id}-${k}" style="font-weight:500">${s.label}</span><input type="date" id="${k}-${m.id}" value="${m.dossier[k]||''}" onchange="act.paxField('${m.id}','${k}',this.value)">${m.aVerifier?.[k]?`<button type="button" id="cf-${m.id}-${k}" class="btn ok sm" onclick="event.preventDefault();act.confirmer('${m.id}','${k}')">Valider la date saisie par l’agent</button>`:''}</label>`;}).join('')}</div>
          <div class="row between"><span class="eyebrow">Tirs · 3 sur 365 jours</span><span class="badge ${ti.cls}">${ti.label}</span></div>
          <div class="dlist">${ti.win.map(t=>`<div><span><b>${frDate(t.date)}</b></span><span class="row" style="gap:6px;flex-wrap:nowrap">${t.ok?'<span class="badge green">Validé</span>':`<button class="btn ok sm" onclick="act.okTir('${m.id}','${t.id}')">Valider</button>`}<button class="btn sm" onclick="act.delTir('${m.id}','${t.id}')">Supprimer</button></span></div>`).join('')||'<div class="small muted">Aucun tir sur les 365 derniers jours.</div>'}</div>
          <div class="row" style="gap:8px"><input type="date" id="tir-${m.id}" class="dinput" max="${iso(TODAY)}" aria-label="Date du tir"><button class="btn sm" onclick="act.addTir('${m.id}')">Ajouter un tir</button></div>
          ${m.id===S.user?'':`<div style="border-top:1px solid var(--line);padding-top:10px"><button class="btn danger sm" onclick="act.delPax('${m.id}')">${S.confirm==='del-'+m.id?'Confirmer la suppression':'Supprimer ce compte'}</button></div>`}
        </div>`:''}`;}).join('')}</div>
    <div><button class="btn sm" onclick="act.reset()">Réinitialiser la démo</button></div>`;
}

render();
</script>
</body></html>
